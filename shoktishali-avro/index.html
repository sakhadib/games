<script>
(() => {
"use strict";
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const isTouch = matchMedia("(pointer: coarse)").matches || (navigator.maxTouchPoints > 0 && matchMedia("(hover: none)").matches);
if (isTouch) document.body.classList.add("touch");
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (a) => a[Math.random() * a.length | 0];

// ---------- canvas ----------
const cv = $("#c"), ctx = cv.getContext("2d");
let DPR = 1, VW = 0, VH = 0, S = 1;
function resize() {
  DPR = Math.min(1.5, devicePixelRatio || 1); VW = innerWidth; VH = innerHeight;
  cv.width = VW * DPR; cv.height = VH * DPR; cv.style.width = VW + "px"; cv.style.height = VH + "px";
  S = Math.min(VH / 500, VW / 470);
}
addEventListener("resize", resize);

// ---------- audio ----------
let AC = null, muted = store.get("av.muted", false);
function ac() { if (muted) return null; try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } if (AC.state === "suspended") AC.resume(); return AC; }
function tone(f, dur, type = "sine", vol = 0.08, slide = 0, delay = 0) {
  const a = ac(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol, f) {
  const a = ac(); if (!a) return;
  const b = a.createBuffer(1, a.sampleRate * dur, a.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
  const s = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain();
  s.buffer = b; fl.type = "lowpass"; fl.frequency.value = f; g.gain.value = vol; s.connect(fl).connect(g).connect(a.destination); s.start();
}
const sfx = {
  jump() { tone(420, 0.14, "triangle", 0.07, 1.8); },
  grab() { tone(300, 0.06, "square", 0.04); noise(0.06, 0.05, 2500); },
  land() { noise(0.07, 0.06, 900); },
  hurt() { tone(330, 0.3, "square", 0.06, 0.4); },
  fall() { tone(600, 0.6, "triangle", 0.07, 0.25); },
  stomp() { tone(180, 0.12, "square", 0.07, 2.2); tone(700, 0.1, "triangle", 0.05, 1, 0.08); },
  star() { [880, 1175, 1568].forEach((f, i) => tone(f, 0.12, "triangle", 0.05, 0, i * 0.06)); },
  yay() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, "triangle", 0.06, 0, i * 0.09)); },
  clear() { [392, 523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.2, "triangle", 0.06, 0, i * 0.1)); },
  roar() { tone(140, 0.5, "sawtooth", 0.06, 0.6); noise(0.4, 0.07, 600); },
  thump() { tone(90, 0.12, "sine", 0.12, 0.7); },
  fire() { noise(0.9, 0.08, 1400); },
  squeak() { tone(1500, 0.08, "square", 0.025, 1.4); },
  ok() { tone(660, 0.08, "triangle", 0.06); },
};
const sndBtn = $("#snd");
function syncSnd() { sndBtn.textContent = muted ? "×" : "♪"; sndBtn.style.opacity = muted ? 0.5 : 1; }
function toggleSnd() { muted = !muted; store.set("av.muted", muted); syncSnd(); if (!muted) sfx.ok(); }
syncSnd(); sndBtn.addEventListener("click", (e) => { e.stopPropagation(); toggleSnd(); });

// ======================================================================
// PHYSICS: shared by the game and by the level checker, so "the checker
// could do it" means "you can do it"
// ======================================================================
const DT = 1 / 120;
const G = 1000, RUN = 175, JUMP_V = 440, JUMP_VC = 415, HAND = 40, BODY = 40, AIRC = 520;
const AMAX = 1.05, AMAXC = 0.92, PUMP = 2.8, PUMPC = 2.3, SLIDE = 240, REL_BOOST = 130;
let ceilPh = 0;
const ceilY = (x) => 52 + Math.sin(x / 260 + ceilPh) * 16 + Math.sin(x / 97 + ceilPh * 2) * 6;
function segIn(W, x) { for (const s of W.segs) if (x >= s.x0 && x <= s.x1) return s; return null; }
function ampOf(th, om, R) { return Math.acos(clamp(Math.cos(th) - (om * om * R) / (2 * G), -1, 1)); }

function grab(p, r) {
  const hx = p.x, hy = p.y - HAND, len = clamp(hy - r.ay, 50, r.L - 6), R = len + HAND;
  p.th = Math.asin(clamp((hx - r.x) / R, -0.6, 0.6));
  p.om = (p.vx * Math.cos(p.th) - p.vy * Math.sin(p.th)) / R;
  const a = ampOf(p.th, p.om, R); if (a > 1.2) p.om *= 0.75;          // a huge leap doesn't flip you over the top
  p.mode = "rope"; p.rope = r; p.len = len; p.ropeT = 0;
  p.x = r.x + R * Math.sin(p.th); p.y = r.ay + R * Math.cos(p.th);
}
function release(p) {
  const R = p.len + HAND;
  p.vx = R * p.om * Math.cos(p.th); p.vy = -R * p.om * Math.sin(p.th) - REL_BOOST;
  p.noGrab = p.rope; p.noGrabT = 0.3; p.mode = "air"; p.rope = null;
}
function stepRope(p, dt, dir, amax, pump) {
  const r = p.rope;
  if (p.len < r.L - 6) p.len = Math.min(r.L - 6, p.len + SLIDE * dt);   // slide down to the grip knot
  const R = p.len + HAND;
  p.om += -(G / R) * Math.sin(p.th) * dt;
  if (dir && (dir * p.om >= 0) && ampOf(p.th, p.om, R) < amax) p.om += dir * pump * dt;   // pump with the swing
  p.om *= 1 - 0.1 * dt;
  p.th += p.om * dt;
  p.x = r.x + R * Math.sin(p.th); p.y = r.ay + R * Math.cos(p.th);
}
function stepAir(p, dt, dir, W) {
  if (dir && dir * p.vx < RUN) p.vx += dir * AIRC * dt;
  p.vy = Math.min(900, p.vy + G * dt);
  let nx = p.x + p.vx * dt, ny = p.y + p.vy * dt;
  const sw = segIn(W, nx);
  if (sw && sw.y < ny - 2 && sw.y < p.y - 2) { nx = p.x; p.vx = 0; }   // bumped the side of a ledge
  const s = segIn(W, nx);
  if (s && p.vy >= 0 && p.y <= s.y + 2 && ny >= s.y) { p.x = nx; p.y = s.y; p.vy = 0; p.vx *= 0.25; p.mode = "ground"; p.seg = s; return "land"; }   // landings stick: no sliding off the far edge
  const c = ceilY(nx); if (ny - BODY - 6 < c) { ny = c + BODY + 6; if (p.vy < 0) p.vy = 0; }
  p.x = nx; p.y = ny;
  if (p.noGrabT > 0) p.noGrabT -= dt;
  const hx = p.x, hy = p.y - HAND;
  for (const r of W.ropes) {
    if (r === p.noGrab && p.noGrabT > 0) continue;
    if (Math.abs(hx - r.x) < 14 && hy > r.ay + 30 && hy < r.ay + r.L) { grab(p, r); return "grab"; }
  }
  if (p.y > 700) return "fall";
  return null;
}
function stepGround(p, dt, dir, W) {
  p.vx += clamp(dir * RUN - p.vx, -1600 * dt, 1600 * dt);
  const nx = p.x + p.vx * dt, s = segIn(W, nx);
  if (s && s.y < p.y - 2) { p.vx = 0; return; }                         // a step up: jump it
  if (!s || s.y > p.y + 2) { p.x = nx; p.mode = "air"; p.vy = 0; p.coyote = 0.1; return; }
  p.x = nx; p.y = s.y; p.seg = s;
}

// ---------- the checker ----------
function simAir(p, W, target) {
  let apex = null;
  for (let k = 0; k < 420; k++) {
    const res = stepAir(p, DT, 0, W);
    if (!apex || p.y < apex[1]) apex = [p.x, p.y - 26];
    if (res === "grab") return { ok: p.rope === target.rope, apex };
    if (res === "land") return { ok: p.seg === target.seg, apex };
    if (res === "fall") return { ok: false };
  }
  return { ok: false };
}
// from a rope pumped to 90% of its biggest swing, can a release reach the target? needs a window of 0.1 s or more
function canSwing(r, target, carry) {
  const amax = (carry ? AMAXC : AMAX) * 0.9, W = { segs: target.seg ? [target.seg] : [], ropes: target.rope ? [target.rope] : [] };
  const R = r.L - 6 + HAND; let th = -amax, om = 0, run = 0, best = 0; const pts = [];
  for (let k = 0; k < 300; k++) {
    om += -(G / R) * Math.sin(th) * DT; om *= 1 - 0.1 * DT; th += om * DT;
    if (om <= 0) { if (k > 10) break; continue; }
    if (k % 2) continue;
    const p = { x: r.x + R * Math.sin(th), y: r.ay + R * Math.cos(th), vx: R * om * Math.cos(th), vy: -R * om * Math.sin(th) - REL_BOOST, mode: "air", noGrab: r, noGrabT: 0.3 };
    const res = simAir(p, W, target);
    if (res.ok) { run++; best = Math.max(best, run); if (res.apex) pts.push(res.apex); } else run = 0;
  }
  return { ok: best >= 7, pts };   // 7 good release moments in a row: a 0.11 s window
}
// from a running jump at the end of a ledge, can you catch the rope? needs a few good take-off spots
function canJump(seg, r, carry) {
  let run = 0, best = 0;
  for (let k = 0; k <= 140; k += 5) {
    const p = { x: seg.x1 - k, y: seg.y, vx: RUN, vy: -(carry ? JUMP_VC : JUMP_V), mode: "air", noGrabT: 0 };
    if (simAir(p, { segs: [seg], ropes: [r] }, { rope: r }).ok) { run++; best = Math.max(best, run); } else run = 0;
  }
  return best >= 6;   // a 30 px stretch of good take-off spots
}

// ======================================================================
// THEMES, WEATHER AND STORIES (rule based, no two in a row alike)
// ======================================================================
const THEMES = [
  { name: "Mushroom Hollow", back: ["#4a3672", "#2a1d45"], rock: "#5b4386", rockD: "#3a2a5c", top: "#7fd1b9", goo: "#6ee7b7", rope: "#c99a5b", deco: "mush" },
  { name: "Crystal Caverns", back: ["#2b4c7a", "#18284a"], rock: "#3a5d92", rockD: "#22385e", top: "#9fd8ff", goo: "#7cc7ff", rope: "#d2a868", deco: "crystal" },
  { name: "Lava Tunnels",    back: ["#6a2c22", "#38140f"], rock: "#7a3a2a", rockD: "#4a1f16", top: "#ffb347", goo: "#ff6b3d", rope: "#a8794a", deco: "ember" },
  { name: "Ice Caves",       back: ["#3d6a8c", "#1f3a52"], rock: "#6b97b8", rockD: "#3f6584", top: "#f0fbff", goo: "#a8e6ff", rope: "#b88a55", deco: "ice" },
  { name: "Jungle Roots",    back: ["#2c5a3a", "#173322"], rock: "#4b6b3a", rockD: "#2f4626", top: "#9be36b", goo: "#5fbf6f", rope: "#5e9e3f", deco: "leaf" },
  { name: "Golden Mines",    back: ["#5a4220", "#2e2110"], rock: "#7a5a2e", rockD: "#4c3818", top: "#ffd166", goo: "#5a3d8a", rope: "#c99a5b", deco: "gold" },
];
const NAMES = ["Mia", "Lily", "Nila", "Tara", "Zoya", "Ruby", "Anu", "Rimi", "Sara", "Ela", "Joya", "Ivy", "Nora", "Maya"];
const WEATHERS = ["sunny", "rainy", "stormy", "snowy", "windy", "foggy"];
const TIMES = ["morning", "afternoon", "evening", "night"];
const MON_WORDS = {
  dino: "dinos are stomping around the ledges",
  ape: "a grumpy gorilla is throwing boulders",
  dragon: "a dragon keeps puffing fire across the ropes",
  bat: "bats are swooping between the ropes",
};
const NEW_WORDS = {
  ape: "a big grumpy gorilla who throws boulders. Jump over them!",
  dragon: "a dragon who puffs fire across the ropes. Wait for the puff to stop!",
  bat: "bats who swoop back and forth. Watch their wings!",
};
// reasons she went in; each one only fits some weather, places or monsters
const REASONS = [
  { id: "kitten", s: (n, pl) => `${n} chased her runaway kitten deep into ${pl}.`, end: "The kitten was already home, fast asleep on the sofa." },
  { id: "ball", s: (n, pl) => `${n}'s red ball bounced all the way into ${pl}, and she went after it.`, end: "She is holding her red ball very tightly now." },
  { id: "fireflies", s: (n, pl) => `${n} followed a trail of glowing fireflies into ${pl}.`, ok: (c) => c.time === "evening" || c.time === "night", end: "The fireflies lit the way home." },
  { id: "hide", s: (n, pl, c) => `${n} ran into ${pl} to hide from the ${c.weather === "stormy" ? "thunder" : "rain"}.`, ok: (c) => c.weather === "rainy" || c.weather === "stormy", end: "Next time, she'll hide under an umbrella." },
  { id: "sled", s: (n, pl) => `${n}'s sled slipped down a snowy hill and slid all the way into ${pl}.`, ok: (c) => c.weather === "snowy", end: "They pulled the sled home together." },
  { id: "kite", s: (n, pl) => `The wind snatched ${n}'s kite and blew it into ${pl}, and she ran in after it.`, ok: (c) => c.weather === "windy", end: "Avro caught the kite on the way out!" },
  { id: "fog", s: (n, pl) => `${n} got lost in the thick fog and wandered into ${pl}.`, ok: (c) => c.weather === "foggy", end: "Her mum's lantern was waiting at the door." },

const OPEN = { sunny: "On a sunny", rainy: "On a rainy", stormy: "During a stormy", snowy: "On a snowy", windy: "On a windy", foggy: "On a foggy" };

// LEVEL GENERATION: ledges, pits and ropes; every gap is proven jumpable
// ======================================================================
let genFails = 0, segs, ropes, dinos, apes, dragons, bats, stars, girl, exitX, TH, story, WORLD;
function gen(L) {

  const pM = Math.min(0.8, 0.2 + L * 0.08), pA = Math.min(0.7, 0.2 + L * 0.05);   // gentle at first
  let cur = { x0: -500, x1: 420, y: 480, start: true }; segs.push(cur);

    if (L >= 2 && w >= 320) opts.push("ape");
    if (!opts.length) return;
    let t = null;

    else if (Math.random() < pM) t = pick(opts);
    if (t === "dino") dinos.push({ x: s.x0 + w * 0.65, y: s.y, lo: s.x0 + 110, hi: s.x1 - 30, dir: -1, sp: Math.min(115, 52 + L * 6), dizzy: 0, t: 0 });
    if (t === "ape") apes.push({ seg: s, x: s.x1 - 55, y: s.y, st: "idle", t: 0, cool: rnd(0.6, 1.4), rock: null });
  };
  for (let i = 0; i < nSec; i++) {
    const isGirl = i === girlAt;
    // sometimes a stretch of ground with a step before the next pit
    if (i > 0 && !isGirl && Math.random() < 0.3) {
      const ny = clamp(cur.y + pick([-40, -32, 32, 40]), 420, 520), w = rnd(300, 420);
      const s = { x0: cur.x1, x1: cur.x1 + w, y: ny }; segs.push(s); cur = s; groundMonster(s);
    }

    const n = ri(1, Math.min(4, 1 + Math.ceil(L / 2)));
    const pit = [];
    let d = rnd(72, 105), r;
    for (;;) { r = makeRope(cur.x1 + d, cur.y); if (canJump(cur, r, carry)) break; if (d < 40) { genFails++; break; } d -= 8; }
    pit.push(r);

      let dd = rnd(170, 250), r2;

    for (;;) { s = { x0: last.x + d2, x1: last.x + d2 + w, y: ny }; const v = canSwing(last, { seg: s }, carry); if (v.ok || d2 < 50) { if (!v.ok) genFails++; starCands.push(...v.pts.filter((_, j) => j % 4 === 2)); break; } d2 -= 12; }

      if (!forcedDone && aer.includes(forced)) { t = forced; forcedDone = true; } else if (Math.random() < pA) t = pick(aer);
      if (t === "dragon") {

        if (range >= 120) dragons.push({ x: dx, y: dy, range: Math.min(380, range), st: "idle", t: rnd(0, 1.5), puffs: [], idle: Math.max(1.6, 2.7 - L * 0.08) });

    }

  TH.torches = []; for (let x = 300; x < exitX - 200; x += rnd(380, 560)) TH.torches.push({ x, y: rnd(200, 300) });

}

// GAME STATE

// ---------- update ----------
function hurt(why) {
