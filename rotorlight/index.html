<script>
(() => {
"use strict";
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const isTouch = matchMedia("(pointer: coarse)").matches || (navigator.maxTouchPoints > 0 && matchMedia("(hover: none)").matches);
if (isTouch) document.body.classList.add("touch");
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);

// ---------- canvas ----------
const cv = $("#c"), ctx = cv.getContext("2d");
const dark = document.createElement("canvas"), dctx = dark.getContext("2d");
let DPR = 1, VW = 0, VH = 0, S = 1;
function resize() {
  DPR = Math.min(1.5, devicePixelRatio || 1); VW = innerWidth; VH = innerHeight;
  cv.width = VW * DPR; cv.height = VH * DPR; cv.style.width = VW + "px"; cv.style.height = VH + "px";
  dark.width = Math.ceil(VW * DPR / 2); dark.height = Math.ceil(VH * DPR / 2);
  S = Math.min(VH / 520, VW / 520);
}
addEventListener("resize", resize);

// ---------- audio ----------
let AC = null, muted = store.get("rl.muted", false), rotor = null;
function ac() { if (muted) return null; try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } if (AC.state === "suspended") AC.resume(); return AC; }
function tone(f, dur, type = "sine", vol = 0.08, slide = 0, delay = 0) {
  const a = ac(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol, f) {
  const a = ac(); if (!a) return;
  const b = a.createBuffer(1, a.sampleRate * dur, a.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
  const s = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain();
  s.buffer = b; fl.type = "lowpass"; fl.frequency.value = f; g.gain.value = vol; s.connect(fl).connect(g).connect(a.destination); s.start();
}
function rotorSound(on, lift) {
  const a = on ? ac() : AC;
  if (on && a && !rotor) {
    // chopping rotor: low saw gated by a fast LFO
    const o = a.createOscillator(), g = a.createGain(), lfo = a.createOscillator(), lg = a.createGain(), master = a.createGain(), fl = a.createBiquadFilter();
    o.type = "sawtooth"; o.frequency.value = 70; fl.type = "lowpass"; fl.frequency.value = 420;
    lfo.type = "square"; lfo.frequency.value = 14; lg.gain.value = 0.5; g.gain.value = 0.5;
    lfo.connect(lg).connect(g.gain); master.gain.value = 0.035;
    o.connect(fl).connect(g).connect(master).connect(a.destination); o.start(); lfo.start();
    rotor = { o, lfo, master };
  }
  if (rotor) {
    if (!on || muted) { try { rotor.o.stop(); rotor.lfo.stop(); } catch (e) {} rotor = null; return; }
    rotor.lfo.frequency.value = lift ? 17 : 13; rotor.o.frequency.value = lift ? 82 : 68;
  }
}
const sfx = {
  board(n) { tone(660 + n * 40, 0.08, "triangle", 0.06); },
  aim() { tone(1400, 0.05, "square", 0.025); },
  shot() { noise(0.18, 0.12, 1800); tone(220, 0.1, "square", 0.04, 0.4); },
  ping() { noise(0.08, 0.05, 3000); },
  crash() { noise(1.3, 0.35, 700); tone(90, 1, "sawtooth", 0.06, 0.3); },
  land() { tone(180, 0.12, "sine", 0.08, 0.7); },
  clear() { [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, 0.18, "triangle", 0.06, 0, i * 0.1)); },
  ok() { tone(660, 0.08, "triangle", 0.06); },
  growl() { tone(110, 0.6, "sawtooth", 0.07, 0.6); noise(0.5, 0.08, 500); },
  chomp() { tone(300, 0.12, "square", 0.05, 0.5); },
  thud() { noise(0.25, 0.15, 300); },
};
const sndBtn = $("#snd");
function syncSnd() { sndBtn.textContent = muted ? "×" : "♪"; sndBtn.style.opacity = muted ? 0.5 : 1; }
function toggleSnd() { muted = !muted; store.set("rl.muted", muted); syncSnd(); if (muted) rotorSound(false); else sfx.ok(); }
syncSnd(); sndBtn.addEventListener("click", (e) => { e.stopPropagation(); toggleSnd(); });

// ======================================================================
// THE HELICOPTER: shape points used for both drawing and collision
// ======================================================================
// local coordinates, nose to the right, y down; rotated by tilt
const HULL = [[18, 1], [12, -6], [0, -8], [-12, -6], [-15, 2], [-6, 9], [12, 8]];
const ROTOR = [[-26, -14], [0, -14], [26, -14]];
const TAIL = [[-24, -2], [-36, -4], [-38, -10]];
const SKIDS = [[-13, 13], [13, 13]];
const ALL_PTS = [...HULL, ...ROTOR, ...TAIL, ...SKIDS];
const SKID_Y = 13;
function worldPts(h, pts) {
  const c = Math.cos(h.tilt), s = Math.sin(h.tilt);
  return pts.map(([x, y]) => [h.x + x * c - y * s, h.y + x * s + y * c]);
}

// ======================================================================
// CAVE GENERATION with fairness guarantees
// ======================================================================
const DX = 16, WORLD_H = 620;
let LX, N, ceil, flr, pads, guns, dinos, decor, exitX, startPad;
// every level is a different cave: its own colours and its own little details on the rock
const THEMES = [
  { name: "Blue Basalt",    air: "#1a2036", rock: ["#07080c", "#0a0b10"], edge: "#4b5478", sheen: "110,125,175", deco: "drip",    dc: "150,180,230", dino: ["#5fae7b", "#f2b36b"] },
  { name: "Glowworm Grotto", air: "#12251e", rock: ["#050907", "#08100c"], edge: "#3f6b52", sheen: "110,190,140", deco: "worm",    dc: "150,255,190", dino: ["#d98a4e", "#f6d58a"] },
  { name: "Crystal Hollow", air: "#211936", rock: ["#08060e", "#0b0912"], edge: "#6b4f9a", sheen: "170,130,230", deco: "crystal", dc: "200,150,255", dino: ["#4fb3a9", "#f2c66b"] },
  { name: "Ember Deep",     air: "#2a1610", rock: ["#0b0605", "#100807"], edge: "#8a4a2c", sheen: "230,120,70",  deco: "ember",   dc: "255,140,70",  dino: ["#7f8fd6", "#f6c48a"] },
  { name: "Frost Vault",    air: "#132634", rock: ["#05090d", "#070c11"], edge: "#6fa2c0", sheen: "170,220,250", deco: "ice",     dc: "190,235,255", dino: ["#e0785f", "#ffd9a8"] },
  { name: "Amber Tomb",     air: "#2a2214", rock: ["#0b0905", "#0f0c07"], edge: "#8a7448", sheen: "230,200,130", deco: "bone",    dc: "240,225,190", dino: ["#9a6fc4", "#f2d08a"] },
];
// the darkness itself carries the cave's colour, so each level reads differently at a glance
for (const t of THEMES) { const n = parseInt(t.air.slice(1), 16), k = 0.55; t.shade = `rgba(${((n >> 16) & 255) * k | 0},${((n >> 8) & 255) * k | 0},${(n & 255) * k | 0},0.8)`; }
let TH = THEMES[0];
const ceilAt = (x) => { const f = clamp(x / DX, 0, N), i = Math.min(N - 1, Math.floor(f)), t = f - i; return ceil[i] + (ceil[i + 1] - ceil[i]) * t; };
const floorAt = (x) => { const f = clamp(x / DX, 0, N), i = Math.min(N - 1, Math.floor(f)), t = f - i; return flr[i] + (flr[i + 1] - flr[i]) * t; };
const solid = (x, y) => y <= ceilAt(x) || y >= floorAt(x);
function los(ax, ay, bx, by) {
  const d = Math.hypot(bx - ax, by - ay), n = Math.ceil(d / 6);
  for (let i = 1; i < n; i++) { const t = i / n, x = ax + (bx - ax) * t, y = ay + (by - ay) * t; if (solid(x, y)) return false; }
  return true;
}
const CLEAR_MIN = 92;   // the copter (rotor tip to skid ~28, nose to tail ~56) always fits with room to spare
function genCave(L) {
  LX = Math.round(2600 + Math.min(L, 10) * 520);
  N = Math.ceil(LX / DX); LX = N * DX;
  ceil = new Array(N + 1); flr = new Array(N + 1);
  const ph = [rnd(0, 6), rnd(0, 6), rnd(0, 6), rnd(0, 6), rnd(0, 6)];
  const baseGap = Math.max(150, 250 - L * 9), wig = Math.min(95, 50 + L * 5);
  for (let i = 0; i <= N; i++) {
    const x = i * DX;
    const mid = WORLD_H / 2 + Math.sin(x / 520 + ph[0]) * 110 + Math.sin(x / 210 + ph[1]) * 40 * Math.min(1, L / 3 + 0.3);
    const gap = baseGap + Math.sin(x / 330 + ph[2]) * wig * 0.6 + Math.sin(x / 140 + ph[3]) * wig * 0.4;
    ceil[i] = mid - gap / 2 + rnd(-5, 5); flr[i] = mid + gap / 2 + rnd(-5, 5);
  }
  // start: a flat apron with room to lift off
  const flatten = (i0, i1, y) => { for (let i = Math.max(0, i0); i <= Math.min(N, i1); i++) flr[i] = y; };
  const sY = flr[6] - 10; flatten(0, 14, sY); for (let i = 0; i <= 16; i++) ceil[i] = Math.min(ceil[i], sY - 190);
  for (let k = 15; k <= 19; k++) flr[k] = Math.max(flr[k], sY + 3);
  startPad = { x0: 0, x1: 14 * DX, y: sY, people: 0, start: true };
  // exit: the far end opens up into the night
  const exI = N - 18; exitX = exI * DX; const eY = flr[exI];
  for (let i = exI; i <= N; i++) { flr[i] = eY + (i - exI) * 2; ceil[i] = Math.min(ceil[i], eY - 160 - (i - exI) * 14); }
  // rock spurs: stalagmites and stalactites that give cover and shape the flight
  const spurs = Math.round(LX / 380);
  for (let k = 0; k < spurs; k++) {
    const c = Math.round(rnd(22, exI - 6)), w = 2 + (Math.random() * 3 | 0), hgt = rnd(40, 80) * Math.min(1.25, 0.8 + L * 0.06), up = Math.random() < 0.5;
    for (let j = -w; j <= w; j++) { const i = c + j; if (i < 18 || i > exI - 2) continue; const f = Math.cos((j / (w + 1)) * Math.PI / 2) * hgt;
      if (up) flr[i] -= f; else ceil[i] += f; }
  }
  // rescue pads: flat ledges wide enough for the skids, with headroom to land and lift off
  pads = [];
  const groups = Math.min(7, 2 + Math.floor(L / 1.5));
  const span = exitX - 700, step = span / groups;
  for (let g = 0; g < groups; g++) {
    const cx = 500 + step * g + rnd(step * 0.2, step * 0.8);
    const i0 = Math.round((cx - 60) / DX), i1 = Math.round((cx + 60) / DX);
    let y = 0; for (let i = i0; i <= i1; i++) y = Math.max(y, flr[i]);
    y -= rnd(0, 30);                                            // sometimes a raised ledge
    flatten(i0, i1, y);
    for (let k = 1; k <= 4; k++) { if (i0 - k >= 0) flr[i0 - k] = Math.max(flr[i0 - k], y + 3); if (i1 + k <= N) flr[i1 + k] = Math.max(flr[i1 + k], y + 3); }   // nothing around the pad sticks up above it
    for (let i = i0 - 5; i <= i1 + 5; i++) if (i >= 0 && i <= N) ceil[i] = Math.min(ceil[i], y - 150);   // headroom over and around the pad
    pads.push({ x0: i0 * DX, x1: i1 * DX, y, people: 1 + (Math.random() * (L > 2 ? 3 : 2) | 0), boarding: 0, wave: Math.random() * 6 });
  }
  // world band
  for (let i = 0; i <= N; i++) { ceil[i] = Math.max(20, ceil[i]); flr[i] = Math.min(WORLD_H - 20, flr[i]); }
  // guarantee: the copter fits everywhere, including round bends (check a window as wide as the copter)
  for (let pass = 0; pass < 6; pass++) {
    let fixed = 0;
    for (let i = 0; i <= N; i++) {
      let lo = Infinity, hi = -Infinity;
      for (let j = Math.max(0, i - 3); j <= Math.min(N, i + 3); j++) { lo = Math.min(lo, flr[j]); hi = Math.max(hi, ceil[j]); }
      if (lo - hi < CLEAR_MIN) {
        const need = CLEAR_MIN - (lo - hi) + 2;
        for (let j = Math.max(0, i - 3); j <= Math.min(N, i + 3); j++) {
          if (isPadIndex(j)) { ceil[j] -= need; continue; }      // never move a pad: open the roof instead
          ceil[j] -= need / 2; flr[j] += need / 2;
        }
        fixed++;
      }
    }
    if (!fixed) break;
  }
  // cave dinos: they sleep in wide hollows, away from ledges. Fly low over one and it wakes, warns, and leaps.
  // a leap never reaches higher than 80 below the roof, so you can always slip over the top
  dinos = [];
  const wantD = Math.min(6, 1 + Math.floor(L / 2));
  for (let tries = 0; dinos.length < wantD && tries < 500; tries++) {
    const x = rnd(800, exitX - 260), i = Math.round(x / DX);
    if (pads.some((p) => x > p.x0 - 240 && x < p.x1 + 240)) continue;
    if (dinos.some((d) => Math.abs(d.x - x) < 420)) continue;
    let y = 0; for (let j = i - 3; j <= i + 3; j++) { y = Math.max(y, flr[j]); }
    let roof = -Infinity; for (let j = i - 5; j <= i + 5; j++) roof = Math.max(roof, ceil[j]);
    const jump = Math.min(150, y - roof - 80 - 55);       // leap height: snout tip stays 80 below the roof
    if (jump < 70) continue;
    for (let j = i - 3; j <= i + 3; j++) flr[j] = y;
    dinos.push({ x: i * DX, y, jump, st: "sleep", t: rnd(0, 3), off: 0, vy: 0, face: Math.random() < 0.5 ? 1 : -1, cool: 0 });
  }
  // little details on the rock for this cave's theme (just for looks: nothing here sticks out far enough to hit)
  decor = [];
  for (let i = 18; i < N - 2; i += 2) if (Math.random() < 0.28) decor.push({ i, top: Math.random() < 0.6, s: rnd(0.6, 1.2), p: rnd(0, 6) });
  // gunmen: on flat bits of floor, far from pads, and never able to see a pad or the start
  guns = [];
  const want = L === 1 ? 2 : Math.min(12, 2 + Math.floor(L * 1.4));
  const watchPts = [...pads.map((p) => [(p.x0 + p.x1) / 2, p.y - 16]), [7 * DX, sY - 16]];
  const reach = cfg(L).range + 60;
  for (let tries = 0; guns.length < want && tries < 600; tries++) {
    const x = rnd(600, exitX - 200), i = Math.round(x / DX);
    if (pads.some((p) => x > p.x0 - 170 && x < p.x1 + 170)) continue;
    if (guns.some((g) => Math.abs(g.x - x) < 220)) continue;
    if (dinos.some((d) => Math.abs(d.x - x) < 200)) continue;
    const y = Math.max(flr[i - 1], flr[i], flr[i + 1]);
    const gx = i * DX, eye = y - 14;
    if (watchPts.some(([px, py]) => Math.hypot(px - gx, py - eye) < reach && los(gx, eye, px, py))) continue;
    if (ceilAt(gx) > y - 60) continue;
    flr[i - 1] = flr[i] = flr[i + 1] = y;
    guns.push({ x: gx, y, eye, bullet: null, aimT: 0, cool: rnd(0.5, 1.5), face: 1, flash: 0 });
  }
  // final pass on the finished cave: anyone who can see a pad or the start (in range) is removed
  guns = guns.filter((g) => !watchPts.some(([px, py]) => Math.hypot(px - g.x, py - g.eye) < reach && los(g.x, g.eye, px, py)));
}
function isPadIndex(j) { const x = j * DX; return pads.some((p) => x >= p.x0 - DX && x <= p.x1 + DX) || x <= 15 * DX; }

// ======================================================================
// GAME STATE
// ======================================================================
let state = "title", stateT = 0, clock = 0, level = 1, rescued = 0, need = 0, levelT = 0, score = 0;
let heli, cam = { x: 0, y: 0 }, parts = [], runners = [], msgT = 0;
let bestLevel = store.get("rl.bestLevel", 0), best = store.get("rl.best", 0);
const keys = {}, touch = { up: false, fwd: false, back: false };
function cfg(L) { return { bullet: Math.min(175, 70 + L * 11), aim: Math.max(0.28, 0.6 - L * 0.03), range: Math.min(460, 300 + L * 18), cool: Math.max(0.35, 1.0 - L * 0.06) }; }
let CFG;
function startLevel(L) {
  level = L; CFG = cfg(L); TH = THEMES[(L - 1) % THEMES.length];
  store.set("rl.level", L); store.set("rl.levelScore", score);   // a crash brings you back here, not to level 1
  genCave(L);
  need = pads.reduce((a, p) => a + p.people, 0); rescued = 0; levelT = 0; parts = []; runners = [];
  heli = { x: 7 * DX, y: startPad.y - SKID_Y, vx: 0, vy: 0, tilt: 0, landed: startPad, rotor: 0, crashed: false };
  cam.x = heli.x; cam.y = heli.y;
  setState("play"); hideCard(); say(L === 1 ? "Hold ↑ to lift off. Find the flares." : `${TH.name}: ${need} people waiting.`, 3.5); updateHud();
}
function setState(s) { state = s; stateT = 0; }
function say(t, d = 2.5) { $("#msg").textContent = t; msgT = d; }

// ---------- physics ----------
const GRAV = 210, LIFT = 430, TILT_MAX = 0.44, TILT_RATE = 1.9, LEVEL_RATE = 1.4, PUSH = 520;
function update(dt) {
  clock += dt; stateT += dt;
  for (const p of parts) { p.vy += 260 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; if (ceil && solid(p.x, p.y)) { p.vx *= -0.3; p.vy *= -0.3; } }
  parts = parts.filter((p) => p.life > 0);
  msgT -= dt; if (msgT <= 0 && msgT > -1) { $("#msg").textContent = ""; msgT = -2; }
  if (state === "crashed") { if (stateT > 1.8) gameOver(); return; }
  if (state !== "play") return;
  levelT += dt;
  const h = heli;
  const up = keys.up || touch.up, fwd = keys.fwd || touch.fwd, back = keys.back || touch.back;
  rotorSound(true, up);
  h.rotor += dt * 40;

  if (h.landed) {
    // boarding: people run over one at a time
    const p = h.landed;
    if (p.people > 0) {
      p.boarding += dt;
      if (p.boarding > 0.55) { p.boarding = 0; p.people--; rescued++; score += 100; sfx.board(rescued);
        runners.push({ x: (p.x0 + p.x1) / 2 + (p.x1 - p.x0) * 0.35, y: p.y, tx: h.x, t: 0 });
        say(p.people ? `Boarding… ${p.people} more here` : rescued >= need ? "Everyone's aboard! Fly to the far end." : "All aboard from this ledge. Lift off!", 2.2); }
    }
    if (up) { h.landed = null; h.vy = -40; h.y -= 1; }
    else { updateGuns(dt); updateDinos(dt); updateHud(); return; }
  }

  // tilt: forward/back keys lean the body, otherwise it settles level
  if (fwd && !back) h.tilt = Math.min(TILT_MAX, h.tilt + TILT_RATE * dt);
  else if (back && !fwd) h.tilt = Math.max(-TILT_MAX, h.tilt - TILT_RATE * dt);
  else h.tilt -= Math.sign(h.tilt) * Math.min(Math.abs(h.tilt), LEVEL_RATE * dt);
  // forces: gravity, rotor lift along the body's up axis, drag
  const thrust = up ? LIFT : GRAV * 0.55;                   // idle rotor still eases the fall
  h.vx += Math.sin(h.tilt) * (up ? PUSH : PUSH * 0.55) * dt;
  h.vy += (GRAV - thrust * Math.cos(h.tilt)) * dt;
  h.vx *= 1 - Math.min(1, 0.9 * dt); h.vy *= 1 - Math.min(1, 0.7 * dt);
  h.vx = clamp(h.vx, -210, 210); h.vy = clamp(h.vy, -190, 230);
  h.x += h.vx * dt; h.y += h.vy * dt;
  if (h.x < 30) { h.x = 30; h.vx = Math.max(0, h.vx); }

  // landing or crashing
  const skids = worldPts(h, SKIDS);
  const onGround = skids.some(([x, y]) => y >= floorAt(x));
  if (onGround) {
    const pad = [startPad, ...pads].find((p) => skids.every(([x]) => x >= p.x0 + 2 && x <= p.x1 - 2));
    if (pad && Math.abs(h.tilt) < 0.18 && h.vy < 75 && Math.abs(h.vx) < 55) {
      h.landed = pad; h.y = pad.y - SKID_Y; h.vx = h.vy = 0; h.tilt = 0; sfx.land();
      if (pad.people) say("Landed. Hold still while they board…", 2);
    } else return crash(pad ? (Math.abs(h.tilt) >= 0.18 ? "Landed too tilted." : "Came down too hard.") : "Touched down off the ledge.");
  }
  for (const [x, y] of worldPts(h, [...HULL, ...ROTOR, ...TAIL])) if (solid(x, y)) return crash(y <= ceilAt(x) ? "Rotor hit the rock." : "Hit the cave wall.");

  // the far end
  if (h.x > exitX + 40) {
    if (rescued >= need) return levelClear();
    if (!h.warned) { say(`${need - rescued} still waiting back there!`, 2.5); h.warned = true; }
    h.x = exitX + 40; h.vx = Math.min(0, h.vx);
  } else h.warned = false;
  updateGuns(dt);
  if (state === "play") updateDinos(dt);
  updateHud();
}

// ---------- gunmen: aim, then one slow straight shot at a time ----------
function updateGuns(dt) {
  const h = heli;
  for (const g of guns) {
    g.flash = Math.max(0, g.flash - dt);
    const sees = Math.abs(h.x - g.x) < CFG.range && Math.hypot(h.x - g.x, h.y - g.eye) < CFG.range && los(g.x, g.eye, h.x, h.y);
    if (sees) g.face = h.x > g.x ? 1 : -1;
    if (g.bullet) {
      const b = g.bullet; b.x += b.vx * dt; b.y += b.vy * dt; b.trail.push([b.x, b.y]); if (b.trail.length > 8) b.trail.shift();
      if (solid(b.x, b.y) || b.x < 0 || b.x > LX) { sfx.ping(); for (let k = 0; k < 4; k++) parts.push({ x: b.x, y: b.y, vx: rnd(-60, 60), vy: rnd(-60, 20), life: 0.3, c: "#ffd98a" }); g.bullet = null; g.cool = CFG.cool; continue; }
      // hit test against the copter's body
      const pts = worldPts(h, [...HULL, ...TAIL, [0, -10]]);
      if (pts.some(([x, y]) => Math.hypot(x - b.x, y - b.y) < 6) || Math.hypot(h.x - b.x, h.y - b.y) < 12) { g.bullet = null; return crash("Shot down."); }
      continue;                                     // a bullet in the air: he waits
    }
    g.cool = Math.max(0, g.cool - dt);
    if (sees && g.cool <= 0) {
      if (g.aimT === 0) sfx.aim();
      g.aimT += dt;
      if (g.aimT >= CFG.aim) {                     // fire at where you are right now, straight line, never steers
        const dx = h.x - g.x, dy = h.y - g.eye, d = Math.hypot(dx, dy);
        g.bullet = { x: g.x + dx / d * 10, y: g.eye + dy / d * 10, vx: dx / d * CFG.bullet, vy: dy / d * CFG.bullet, trail: [] };
        g.aimT = 0; g.flash = 0.12; sfx.shot();
      }
    } else g.aimT = Math.max(0, g.aimT - dt * 2);
  }
}

// ---------- cave dinos: sleep → wake (a roar and a warning) → leap straight up → back to sleep ----------
const DINO_G = 900;
function dinoParts(d) {   // body, head and snout as circles, for collision
  const y = d.y - d.off, up = d.st === "jump";
  return up ? [[d.x, y - 14, 15], [d.x + d.face * 4, y - 34, 10], [d.x + d.face * 7, y - 46, 7]]
            : [[d.x - d.face * 4, y - 11, 16], [d.x + d.face * 15, y - 16, 9]];
}
function updateDinos(dt) {
  const h = heli;
  for (const d of dinos) {
    d.t += dt; d.cool = Math.max(0, d.cool - dt);
    if (d.st === "sleep") {
      if (d.cool <= 0 && !h.landed && Math.abs(h.x - d.x) < 150 && h.y < d.y && h.y > d.y - 270) {
        d.st = "alert"; d.t = 0; d.face = h.x > d.x ? 1 : -1; sfx.growl();
      }
    } else if (d.st === "alert") {
      if (d.t > 0.75) { d.st = "jump"; d.t = 0; d.vy = -Math.sqrt(2 * DINO_G * d.jump); sfx.chomp(); }
    } else if (d.st === "jump") {
      d.vy += DINO_G * dt; d.off -= d.vy * dt;
      if (d.off <= 0) { d.off = 0; d.st = "rest"; d.t = 0; sfx.thud(); for (let k = 0; k < 8; k++) parts.push({ x: d.x + rnd(-18, 18), y: d.y - 2, vx: rnd(-70, 70), vy: rnd(-90, -20), life: 0.5, c: "#8a8070" }); }
    } else if (d.st === "rest" && d.t > 1.4) { d.st = "sleep"; d.t = 0; d.cool = 1.6; }
    // bite check
    if (state === "play") {
      const pts = worldPts(h, ALL_PTS);
      for (const [cx, cy, r] of dinoParts(d)) if (pts.some(([x, y]) => (x - cx) ** 2 + (y - cy) ** 2 < r * r)) return crash(d.st === "sleep" ? "You bumped a sleeping dino. It bit!" : "A cave dino chomped you!");
    }
  }
}

function crash(why) {
  if (state !== "play") return;
  heli.crashed = true; setState("crashed"); rotorSound(false); sfx.crash(); say(why, 3);
  for (let k = 0; k < 50; k++) parts.push({ x: heli.x + rnd(-14, 14), y: heli.y + rnd(-8, 8), vx: rnd(-160, 160), vy: rnd(-200, 40), life: rnd(0.6, 1.6), c: k % 3 ? "#ff8a4c" : "#c9d0e0" });
  heli.why = why;
}
function levelClear() {
  setState("between"); rotorSound(false); sfx.clear();
  const bonus = Math.max(0, Math.round((60 + level * 25 - levelT) * 5));
  score += 250 * level + bonus;
  if (level > bestLevel) { bestLevel = level; store.set("rl.bestLevel", bestLevel); }
  store.set("rl.level", level + 1); store.set("rl.levelScore", score);
  if (score > best) { best = score; store.set("rl.best", best); }
  showCard(`<div class="kicker">Level ${level} complete</div><h1>Everyone's <span>out.</span></h1>
    <div class="rows"><span>Rescued</span><b>${rescued}</b><span>Time</span><b>${fmt(levelT)}</b><span>Time bonus</span><b>+${bonus}</b><span>Score</span><b>${score}</b></div>
    <p>Next up: <b style="color:var(--warm)">${THEMES[level % THEMES.length].name}</b>. Longer, with more people, gunmen and dinos.</p>
    <button class="go" data-a="next">Next cave</button>`);
  updateHud();
}
function gameOver() {
  if (score > best) { best = score; store.set("rl.best", best); }
  setState("over");
  showCard(`<div class="kicker">${heli.why || "Crashed"}</div><h1><span class="r">Crashed</span> on level ${level}.</h1>
    <div class="rows"><span>Rescued this level</span><b>${rescued} / ${need}</b><span>Score</span><b>${score}</b><span>Best score</span><b>${best}</b><span>Best level cleared</span><b>${bestLevel}</b></div>
    <button class="go" data-a="replay">Replay level ${level}</button>${level > 1 ? `<button class="go ghost" data-a="reset">Start over</button>` : ""}`);
  updateHud();
}
const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

// ---------- HUD ----------
function updateHud() {
  $("#lv").textContent = "LEVEL " + level;
  $("#res").innerHTML = `${rescued}<small> / ${need} rescued</small>`;
  $("#best").textContent = "BEST LEVEL " + bestLevel;
}
const ov = $("#ov"), card = $("#card");
function showCard(h) { card.innerHTML = h; ov.classList.add("show"); }
function hideCard() { ov.classList.remove("show"); }
const savedLevel = () => Math.max(1, store.get("rl.level", 1) | 0);
function showTitle() {
  setState("title");
  showCard(`<div class="kicker">Search and rescue</div><h1>Rotor<span>light</span></h1>
    <p>People are stranded on ledges deep in a dark cave. Fly in, land, take them aboard, and fly out the far end.</p>
    <ul>
      <li>Touch any rock and you crash. The rotor counts.</li>
      <li>Land on the flat ledge, slow and level. Stay put while they board.</li>
      <li>Gunmen aim, then fire one slow, straight shot. While it's in the air they can't fire again. You can't shoot back.</li>
    <li>Cave dinos sleep in the hollows. Fly low over one and it wakes up and leaps. Stay high, or zip past.</li>
    </ul>
    <p>${isTouch ? "LIFT to climb. ◀ ▶ tilt to fly back and forth." : "<kbd>↑</kbd> lift · <kbd>→</kbd> tilt forward · <kbd>←</kbd> tilt back"}</p>
    ${savedLevel() > 1 ? `<button class="go" data-a="start">Continue · level ${savedLevel()}</button><button class="go ghost" data-a="reset">Start over</button>` : `<button class="go" data-a="start">Take off</button>`}`);
}
ov.addEventListener("click", (e) => {
  const b = e.target.closest("[data-a]"); if (!b) return; sfx.ok();
  if (b.dataset.a === "start") { score = store.get("rl.levelScore", 0); startLevel(savedLevel()); }
  if (b.dataset.a === "replay") { score = store.get("rl.levelScore", 0); startLevel(level); }
  if (b.dataset.a === "reset") { score = 0; startLevel(1); }
  if (b.dataset.a === "next") startLevel(level + 1);
  if (b.dataset.a === "resume") { setState("play"); hideCard(); }
});

// ======================================================================
// RENDER
// ======================================================================
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = "#06070c"; ctx.fillRect(0, 0, VW, VH);
  if (!ceil) return;
  const h = heli;
  if (state === "play" || state === "title") {
    cam.x += (h.x + h.vx * 0.6 - cam.x) * 0.08; cam.y += (h.y - cam.y) * 0.08;
  }
  const viewW = VW / S, viewH = VH / S;
  cam.y = clamp(cam.y, viewH / 2 - 60, Math.max(viewH / 2 - 60, WORLD_H + 60 - viewH / 2));
  const ox = VW / 2 - cam.x * S, oy = VH / 2 - cam.y * S;
  ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * ox, DPR * oy);
  const x0 = Math.max(0, Math.floor((cam.x - viewW / 2) / DX) - 2), x1 = Math.min(N, Math.ceil((cam.x + viewW / 2) / DX) + 2);

  // open air past the exit and a far, dim cave wall behind everything
  ctx.fillStyle = TH.air; ctx.fillRect(x0 * DX, -200, (x1 - x0) * DX, WORLD_H + 400);
  if (x1 * DX > exitX - 400) { const g = ctx.createLinearGradient(exitX - 200, 0, LX, 0); g.addColorStop(0, "rgba(40,50,90,0)"); g.addColorStop(1, "rgba(60,75,130,.6)"); ctx.fillStyle = g; ctx.fillRect(exitX - 200, -200, LX - exitX + 400, WORLD_H + 400); }
  // rock
  const rock = ctx.createLinearGradient(0, 0, 0, WORLD_H); rock.addColorStop(0, TH.rock[0]); rock.addColorStop(1, TH.rock[1]);
  ctx.fillStyle = rock;
  ctx.beginPath(); ctx.moveTo(x0 * DX, -400); for (let i = x0; i <= x1; i++) ctx.lineTo(i * DX, ceil[i]); ctx.lineTo(x1 * DX, -400); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x0 * DX, WORLD_H + 400); for (let i = x0; i <= x1; i++) ctx.lineTo(i * DX, flr[i]); ctx.lineTo(x1 * DX, WORLD_H + 400); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = TH.edge; ctx.lineWidth = 2;
  ctx.beginPath(); for (let i = x0; i <= x1; i++) i === x0 ? ctx.moveTo(i * DX, ceil[i]) : ctx.lineTo(i * DX, ceil[i]); ctx.stroke();
  ctx.beginPath(); for (let i = x0; i <= x1; i++) i === x0 ? ctx.moveTo(i * DX, flr[i]) : ctx.lineTo(i * DX, flr[i]); ctx.stroke();
  // pads: marked ledges
  for (const p of [startPad, ...pads]) {
    if (p.x1 < x0 * DX || p.x0 > x1 * DX) continue;
    ctx.fillStyle = p.start ? "#3f6f8f" : p.people ? "#c9a24a" : "#4a5068"; ctx.fillRect(p.x0, p.y - 1, p.x1 - p.x0, 3);
    for (let x = p.x0 + 6; x < p.x1 - 4; x += 14) { ctx.fillStyle = p.people ? "rgba(255,217,138,.35)" : "rgba(255,255,255,.12)"; ctx.fillRect(x, p.y + 4, 6, 2); }
    if (!p.start && p.people) {   // stranded people waving flares
      for (let k = 0; k < p.people; k++) drawPerson((p.x0 + p.x1) / 2 + (p.x1 - p.x0) * 0.35 - k * 9, p.y, p.wave + k);
    }
  }
  for (const r of runners) { r.t += 1 / 60; const x = r.x + (r.tx - r.x) * Math.min(1, r.t * 2.2); if (r.t < 0.45) drawPerson(x, r.y, r.t * 40, true); }
  runners = runners.filter((r) => r.t < 0.45);
  // gunmen
  for (const g of guns) { if (g.x < x0 * DX - 20 || g.x > x1 * DX + 20) continue; drawGunman(g); }
  for (const d of dinos) { if (d.x < x0 * DX - 60 || d.x > x1 * DX + 60) continue; drawDino(d); }

  // ---------- darkness: searchlight, cabin glow, flares, the exit's moonlight ----------
  const hs = DPR * 0.5;
  dctx.setTransform(1, 0, 0, 1, 0, 0); dctx.globalCompositeOperation = "source-over";
  dctx.fillStyle = TH.shade; dctx.fillRect(0, 0, dark.width, dark.height);
  dctx.setTransform(hs * S, 0, 0, hs * S, hs * ox, hs * oy); dctx.globalCompositeOperation = "destination-out";
  const beam = !h.crashed ? searchlight(h) : null;
  if (beam) {
    const g = dctx.createRadialGradient(beam.x, beam.y, 6, beam.x, beam.y, 300); g.addColorStop(0, "rgba(0,0,0,1)"); g.addColorStop(0.6, "rgba(0,0,0,.8)"); g.addColorStop(1, "rgba(0,0,0,0)");
    dctx.fillStyle = g; dctx.beginPath(); dctx.moveTo(beam.x, beam.y); for (const p of beam.pts) dctx.lineTo(p[0], p[1]); dctx.closePath(); dctx.fill();
  }
  softHole(h.x, h.y, 70, 0.75);
  for (const p of pads) if (p.people) softHole((p.x0 + p.x1) / 2 + (p.x1 - p.x0) * 0.35, p.y - 12, 60 + Math.sin(clock * 9 + p.wave) * 5, 0.85);
  for (const g of guns) { if (g.aimT > 0 || g.flash > 0) softHole(g.x, g.eye, g.flash > 0 ? 70 : 26, 0.8); if (g.bullet) softHole(g.bullet.x, g.bullet.y, 22, 0.9); }
  softHole(LX - 40, WORLD_H / 2 - 40, 520, 0.55);
  for (const p of parts) softHole(p.x, p.y, 10, 0.6);
  for (const d of dinos) if (d.x > x0 * DX - 60 && d.x < x1 * DX + 60) softHole(d.x, d.y - 18 - d.off, d.st === "sleep" ? 34 : 60, d.st === "sleep" ? 0.35 : 0.7);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(dark, 0, 0, cv.width, cv.height);
  ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * ox, DPR * oy);
  // faint wet sheen on the rock edges, so the cave's shape reads even in the dark
  ctx.strokeStyle = `rgba(${TH.sheen},.2)`; ctx.lineWidth = 1.5;
  ctx.beginPath(); for (let i = x0; i <= x1; i++) i === x0 ? ctx.moveTo(i * DX, ceil[i]) : ctx.lineTo(i * DX, ceil[i]); ctx.stroke();
  ctx.beginPath(); for (let i = x0; i <= x1; i++) i === x0 ? ctx.moveTo(i * DX, flr[i]) : ctx.lineTo(i * DX, flr[i]); ctx.stroke();

  drawDecor(x0, x1);
  for (const d of dinos) {
    if (d.x < x0 * DX - 60 || d.x > x1 * DX + 60) continue;
    if (d.st === "sleep") { ctx.fillStyle = "rgba(220,230,255,.55)"; ctx.font = "700 9px system-ui";
      for (let k = 0; k < 3; k++) { const ph = (d.t * 0.6 + k / 3) % 1; ctx.globalAlpha = Math.sin(ph * Math.PI) * 0.8; ctx.fillText("z", d.x + d.face * 14 + ph * 10, d.y - 28 - ph * 22); } ctx.globalAlpha = 1; }
    if (d.st === "alert") { ctx.fillStyle = "#ffd98a"; ctx.font = "900 16px system-ui"; ctx.textAlign = "center"; ctx.fillText("!", d.x + d.face * 12, d.y - 38 - Math.abs(Math.sin(d.t * 18)) * 3); ctx.textAlign = "start"; }
    if (d.st !== "sleep") { const [hx, hy] = dinoParts(d)[1]; ctx.fillStyle = "#ffe066"; ctx.beginPath(); ctx.arc(hx + d.face * 2, hy - 3, 1.6, 0, 7); ctx.fill(); }
  }

  // things that glow above the dark
  if (beam) { const g = ctx.createRadialGradient(beam.x, beam.y, 4, beam.x, beam.y, 300); g.addColorStop(0, "rgba(255,227,163,.16)"); g.addColorStop(1, "rgba(255,227,163,0)"); ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(beam.x, beam.y); for (const p of beam.pts) ctx.lineTo(p[0], p[1]); ctx.closePath(); ctx.fill(); }
