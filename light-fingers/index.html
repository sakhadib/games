const $ = (s) => document.querySelector(s);

// ---------- canvas ----------

// ---------- audio ----------

const sfx = {
  coin() { tone(1318, 0.09, "triangle", 0.06); tone(1760, 0.14, "triangle", 0.05, 0, 0.06); },
  step(v) { thump(v, 90); },
  myStep(v) { thump(v, 160); },
  heart(v) { tone(55, 0.12, "sine", v); tone(50, 0.14, "sine", v * 0.8, 0, 0.16); },
  alert() { tone(880, 0.12, "square", 0.05); tone(1175, 0.2, "square", 0.05, 0, 0.1); },
  hmm() { tone(420, 0.25, "triangle", 0.05, 1.3); },
  hide() { tone(180, 0.18, "triangle", 0.05, 0.7); thump(0.06, 200); },
  whack() { thump(0.35, 300); tone(160, 0.1, "square", 0.06, 0.5); },
  clear() { [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, 0.18, "triangle", 0.06, 0, i * 0.1)); },

const sndBtn = $("#snd");

function toggleSnd() { muted = !muted; store.set("lf.muted", muted); syncSnd(); if (!muted) sfx.ok(); }
syncSnd(); sndBtn.addEventListener("click", (e) => { e.stopPropagation(); toggleSnd(); });

// ======================================================================
// APARTMENT GENERATION: split a rectangle into rooms (BSP), thin walls,
// doorways on every split (plus extra ones for loops), furniture, coins.
// ======================================================================
const WALL = 6, DOOR = 56, R_THIEF = 10, R_COP = 11;
let AW, AH, rooms, walls, doors, furn, wardrobes, coins, adj;

function genApartment(L) {
  const k = Math.min(L, 7);
  AW = 760 + 130 * k; AH = 520 + 90 * k;
  const MIN = 165, maxDepth = 3 + Math.floor(Math.min(L, 9) / 3);
  const leaves = [], splits = [];
  (function split(r, depth) {
    const canV = r.w >= MIN * 2, canH = r.h >= MIN * 2;
    const small = r.w * r.h < MIN * MIN * 4.5;
    if ((!canV && !canH) || depth >= maxDepth || (depth >= 2 && small && Math.random() < 0.6)) { leaves.push(r); return; }
    const vert = canV && (!canH || r.w > r.h * 1.15 || (r.w / r.h > 0.87 && Math.random() < 0.5));
    if (vert) {
      const x = Math.round(rnd(r.x + MIN, r.x + r.w - MIN) / 10) * 10;
      splits.push({ v: true, c: x, a: r.y, b: r.y + r.h });
      split({ x: r.x, y: r.y, w: x - r.x, h: r.h }, depth + 1); split({ x, y: r.y, w: r.x + r.w - x, h: r.h }, depth + 1);
    } else {
      const y = Math.round(rnd(r.y + MIN, r.y + r.h - MIN) / 10) * 10;
      splits.push({ v: false, c: y, a: r.x, b: r.x + r.w });
      split({ x: r.x, y: r.y, w: r.w, h: y - r.y }, depth + 1); split({ x: r.x, y, w: r.w, h: r.y + r.h - y }, depth + 1);

  // walls: the outer shell, then each split line with doorway gaps cut out
  walls = [
    { ax: 0, ay: 0, bx: AW, by: 0 }, { ax: AW, ay: 0, bx: AW, by: AH }, { ax: AW, ay: AH, bx: 0, by: AH }, { ax: 0, ay: AH, bx: 0, by: 0 },
  ];
  doors = [];
  for (const s of splits) {
    // T-junctions: where a perpendicular wall meets this one; doorways must stay clear of them
    const ts = [s.a, s.b];
    for (const o of splits) if (o.v !== s.v && (o.a === s.c || o.b === s.c) && o.c > s.a && o.c < s.b) ts.push(o.c);
    ts.sort((p, q) => p - q);
    const free = []; for (let i = 0; i < ts.length - 1; i++) if (ts[i + 1] - ts[i] >= DOOR + 30) free.push([ts[i] + DOOR / 2 + 12, ts[i + 1] - DOOR / 2 - 12]);

    const centers = [];
    for (let n = 0; n < want && free.length; n++) {
      const segs = free.filter((f) => f[1] >= f[0]); if (!segs.length) break;
      const f = pick(segs), d = rnd(f[0], f[1]);
      if (centers.every((c) => Math.abs(c - d) > DOOR * 2)) centers.push(d);
    }
    if (!centers.length) centers.push((s.a + s.b) / 2);
    centers.sort((p, q) => p - q);
    let start = s.a;
    for (const d of centers) {
      addWallPiece(s, start, d - DOOR / 2); start = d + DOOR / 2;
      const dx = s.v ? s.c : d, dy = s.v ? d : s.c;
      const ra = roomAt(s.v ? dx - 4 : dx, s.v ? dy : dy - 4), rb = roomAt(s.v ? dx + 4 : dx, s.v ? dy : dy + 4);
      if (ra && rb && ra !== rb) doors.push({ x: dx, y: dy, v: s.v, a: ra.i, b: rb.i });
    }
    addWallPiece(s, start, s.b);
  }
  addLoops();
  adj = rooms.map(() => []);
  for (const [di, d] of doors.entries()) { adj[d.a].push({ to: d.b, door: di }); adj[d.b].push({ to: d.a, door: di }); }

  // room types: the biggest is the living room, small ones become bathrooms, one kitchen
  const byArea = [...rooms].sort((p, q) => q.w * q.h - p.w * p.h);
  byArea[0].type = "living";
  if (byArea.length > 2) byArea[byArea.length - 1].type = "bath";
  if (byArea.length > 3) byArea[1].type = "kitchen";
  if (byArea.length > 5) byArea[byArea.length - 2].type = "bath";

  // furniture against walls, never blocking doorways; wardrobes are hiding spots
  furn = []; wardrobes = [];
  for (const r of rooms) {
    const items = r.type === "living" ? [["sofa", 96, 30], ["shelf", 60, 18], ["plant", 18, 18]]
      : r.type === "kitchen" ? [["counter", 110, 24], ["fridge", 30, 28], ["table", 44, 44, true]]
      : r.type === "bath" ? [["tub", 64, 32], ["sink", 30, 20]]
      : [["bed", 62, 84], ["wardrobe", 46, 22], ["desk", 50, 22]];
    for (const [kind, w, h, middle] of items) placeFurniture(r, kind, w, h, middle);
    if (r.type === "living" && Math.random() < 0.6) placeFurniture(r, "wardrobe", 46, 22);
  }
  if (!wardrobes.length) { const r = rooms.find((q) => q.type !== "bath") || rooms[0]; placeFurniture(r, "wardrobe", 46, 22); }

  const cap = 2 + Math.floor(L / 3);
  while (wardrobes.length > cap) { const w = wardrobes.splice((Math.random() * wardrobes.length) | 0, 1)[0]; furn.splice(furn.indexOf(w), 1); }
}
// extra doorways between neighbouring rooms that aren't directly connected yet: loops let you circle around him
function addLoops() {
  const linked = new Set(doors.map((d) => Math.min(d.a, d.b) + "-" + Math.max(d.a, d.b)));
  const ends = []; for (const w of walls) ends.push([w.ax, w.ay], [w.bx, w.by]);
  const want = Math.max(2, Math.round(rooms.length / 2.5));

  for (let i = 4; i < walls.length; i++) {
    const w = walls[i], v = w.ax === w.bx, a0 = v ? Math.min(w.ay, w.by) : Math.min(w.ax, w.bx), a1 = v ? Math.max(w.ay, w.by) : Math.max(w.ax, w.bx), c = v ? w.ax : w.ay;

    if (linked.has(k.key)) continue;
    const w = walls[k.i]; if (!w) continue;
    const v = k.v, a0 = v ? Math.min(w.ay, w.by) : Math.min(w.ax, w.bx), a1 = v ? Math.max(w.ay, w.by) : Math.max(w.ax, w.bx);
    if (k.p - DOOR / 2 < a0 || k.p + DOOR / 2 > a1) continue;

    addWallPiece(s, a0, k.p - DOOR / 2); addWallPiece(s, k.p + DOOR / 2, a1);
    doors.push({ x: v ? k.c : k.p, y: v ? k.p : k.c, v, a: k.ra.i, b: k.rb.i });

    for (const q of cands) if (q.i >= k.i) q.i = -1;

}
function addWallPiece(s, a, b) {
  if (b - a < 2) return;
  walls.push(s.v ? { ax: s.c, ay: a, bx: s.c, by: b } : { ax: a, ay: s.c, bx: b, by: s.c });

function roomAt(x, y) { for (const r of rooms) if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return r; return null; }

  const inset = WALL / 2 + 2;
  for (let tries = 0; tries < 40; tries++) {
    let x, y, ww = w, hh = h, side = (Math.random() * 4) | 0;
    if (middle) { x = r.x + rnd(r.w * 0.25, r.w * 0.75 - w); y = r.y + rnd(r.h * 0.25, r.h * 0.75 - h); }
    else {

      if (ww > r.w - 20 || hh > r.h - 20) continue;
      if (side === 0) { x = r.x + rnd(inset, r.w - ww - inset); y = r.y + inset; }
      if (side === 2) { x = r.x + rnd(inset, r.w - ww - inset); y = r.y + r.h - hh - inset; }
      if (side === 1) { x = r.x + r.w - ww - inset; y = r.y + rnd(inset, r.h - hh - inset); }
      if (side === 3) { x = r.x + inset; y = r.y + rnd(inset, r.h - hh - inset); }

    if (nearDoor(x, y, ww, hh, 50) || rectHit(x, y, ww, hh, 26)) continue;

  if (b.dataset.a === "start" || b.dataset.a === "replay") { score = 0; startLevel(1); }
  if (b.dataset.a === "next") startLevel(level + 1);
  if (b.dataset.a === "resume") { setState("play"); hideCard(); }
});

// ======================================================================
// RENDER
// ======================================================================
const FLOOR = { living: "#2a221d", bed: "#221f2e", kitchen: "#1f2429", bath: "#1b262b" };
const FCOL = { sofa: "#5b4a6b", shelf: "#4a3b2f", plant: "#2f5a3f", counter: "#4d5560", fridge: "#6b7480", table: "#5a4636", tub: "#8c9aa6", sink: "#8c9aa6", bed: "#4a5578", wardrobe: "#5e4733", desk: "#51402f" };
function visPoly(x, y, a0, a1, range, n) {
  const pts = [];
  for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n, d = castRay(x, y, a, range); pts.push([x + Math.cos(a) * d, y + Math.sin(a) * d]); }
  return pts;
}
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = "#05060b"; ctx.fillRect(0, 0, VW, VH);
  if (!rooms) return;
  // camera follows the thief smoothly
  cam.x += (thief.x - cam.x) * 0.12; cam.y += (thief.y - cam.y) * 0.12;
  const ox = VW / 2 - cam.x * S, oy = VH / 2 - cam.y * S;
  ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * ox, DPR * oy);

  // floors
  for (const r of rooms) { ctx.fillStyle = FLOOR[r.type]; ctx.fillRect(r.x, r.y, r.w, r.h); }
  ctx.strokeStyle = "rgba(255,255,255,.025)"; ctx.lineWidth = 1;
  for (const r of rooms) if (r.type === "kitchen" || r.type === "bath") { ctx.beginPath(); for (let x = r.x + 20; x < r.x + r.w; x += 20) { ctx.moveTo(x, r.y); ctx.lineTo(x, r.y + r.h); } for (let y = r.y + 20; y < r.y + r.h; y += 20) { ctx.moveTo(r.x, y); ctx.lineTo(r.x + r.w, y); } ctx.stroke(); }
  // furniture
  for (const f of furn) {
    ctx.fillStyle = "rgba(0,0,0,.35)"; rr(f.x + 2, f.y + 3, f.w, f.h, 4); ctx.fill();
    ctx.fillStyle = FCOL[f.kind] || "#555"; rr(f.x, f.y, f.w, f.h, f.kind === "plant" ? f.w / 2 : 4); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.08)";
    if (f.kind === "bed") { const vert = f.h > f.w; rr(vert ? f.x + 5 : f.x + 5, vert ? f.y + 5 : f.y + 5, vert ? f.w - 10 : 16, vert ? 16 : f.h - 10, 3); ctx.fill(); }
    if (f.kind === "wardrobe") { ctx.fillStyle = "rgba(0,0,0,.3)"; if (f.w > f.h) ctx.fillRect(f.x + f.w / 2 - 0.75, f.y + 2, 1.5, f.h - 4); else ctx.fillRect(f.x + 2, f.y + f.h / 2 - 0.75, f.w - 4, 1.5); }
    if (f.kind === "sofa") { ctx.fillStyle = "rgba(255,255,255,.06)"; rr(f.x + 4, f.y + 4, f.w - 8, f.h - 8, 3); ctx.fill(); }
  }
  // coins
  for (const c of coins) {
    const gl = 0.5 + 0.5 * Math.sin(clock * 3 + c.ph);
    ctx.fillStyle = "#e8b64a"; ctx.beginPath(); ctx.arc(c.x, c.y, 5.5, 0, 7); ctx.fill();
    ctx.fillStyle = `rgba(255,240,180,${0.5 + gl * 0.5})`; ctx.beginPath(); ctx.arc(c.x - 1.5, c.y - 1.5, 2, 0, 7); ctx.fill();
  }
  // walls
  ctx.strokeStyle = "#b9b4cc"; ctx.lineWidth = WALL; ctx.lineCap = "square";
  ctx.beginPath(); for (const w of walls) { ctx.moveTo(w.ax, w.ay); ctx.lineTo(w.bx, w.by); } ctx.stroke();
  // warm torchlight on the floor (under the darkness, so it reads as light)
  const torches = cops.map((c) => ({ c, poly: visPoly(c.x, c.y, c.dir - CFG.half, c.dir + CFG.half, CFG.range, 34) }));
  for (const { c, poly } of torches) {
    const g = ctx.createRadialGradient(c.x, c.y, 10, c.x, c.y, CFG.range);
    g.addColorStop(0, "rgba(255,214,140,.30)"); g.addColorStop(1, "rgba(255,214,140,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(c.x, c.y); for (const p of poly) ctx.lineTo(p[0], p[1]); ctx.closePath(); ctx.fill();
  }

  // ---------- darkness: only what you see, what the torches light, and a faint memory ----------
  const myPoly = visPoly(thief.x, thief.y, -Math.PI, Math.PI, 150, 90);
  const hs = DPR * 0.5;
  dctx.setTransform(1, 0, 0, 1, 0, 0); dctx.globalCompositeOperation = "source-over";
  dctx.fillStyle = "rgba(3,3,8,0.985)"; dctx.fillRect(0, 0, dark.width, dark.height);
  dctx.setTransform(hs * S, 0, 0, hs * S, hs * ox, hs * oy);
  dctx.globalCompositeOperation = "destination-out";
  dctx.globalAlpha = 0.16; dctx.drawImage(memory, 0, 0, AW, AH); dctx.globalAlpha = 1;          // remembered rooms
  let g = dctx.createRadialGradient(thief.x, thief.y, 20, thief.x, thief.y, 150);
  g.addColorStop(0, "rgba(0,0,0,.95)"); g.addColorStop(0.6, "rgba(0,0,0,.7)"); g.addColorStop(1, "rgba(0,0,0,0)");
  dctx.fillStyle = g; dctx.beginPath(); dctx.moveTo(myPoly[0][0], myPoly[0][1]); for (const p of myPoly) dctx.lineTo(p[0], p[1]); dctx.closePath(); dctx.fill();
  for (const { c, poly } of torches) {
    g = dctx.createRadialGradient(c.x, c.y, 8, c.x, c.y, CFG.range);
    g.addColorStop(0, "rgba(0,0,0,1)"); g.addColorStop(0.7, "rgba(0,0,0,.85)"); g.addColorStop(1, "rgba(0,0,0,0)");
    dctx.fillStyle = g; dctx.beginPath(); dctx.moveTo(c.x, c.y); for (const p of poly) dctx.lineTo(p[0], p[1]); dctx.closePath(); dctx.fill();
    dctx.beginPath(); dctx.arc(c.x, c.y, 16, 0, 7); dctx.fill();                           // his own hand glow
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(dark, 0, 0, cv.width, cv.height);
  ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * ox, DPR * oy);

  // noise rings (you can see how loud you are)
  for (const n of noise) { ctx.strokeStyle = `rgba(255,207,122,${0.22 * (1 - n.t / 0.7)})`; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(n.x, n.y, 14 + n.t / 0.7 * (n.r - 14) * 0.5, 0, 7); ctx.stroke(); }
  // wardrobe hint
  const nw = state === "play" && !thief.hidden ? nearWardrobe() : null;
  if (nw) { ctx.strokeStyle = `rgba(169,188,255,${0.5 + 0.3 * Math.sin(clock * 6)})`; ctx.lineWidth = 2; rr(nw.x - 3, nw.y - 3, nw.w + 6, nw.h + 6, 5); ctx.stroke(); }
  // officers: lit by their own torch, clearer when you can see them
  for (const c of cops) {
    const vis = Math.hypot(c.x - thief.x, c.y - thief.y) < 150 && los(c.x, c.y, thief.x, thief.y) ? 1 : 0.55;
    drawCop(c, vis);
  }
  drawThief();
  // popups
  ctx.textAlign = "center";
  for (const p of popups) { ctx.globalAlpha = 1 - p.t / 1.2; ctx.fillStyle = p.red ? "#ff5a5f" : "#ffd88a"; ctx.font = `800 ${p.red ? 13 : 9}px system-ui`; ctx.fillText(p.text, p.x, p.y - 12 - p.t * 18); }
  ctx.globalAlpha = 1; ctx.textAlign = "start";
  // vignette pulse when spotted
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (state === "play" && cops.some((c) => c.state === "chase")) { ctx.fillStyle = `rgba(255,60,70,${0.06 + 0.05 * Math.sin(clock * 10)})`; ctx.fillRect(0, 0, VW, VH); }
  if (state === "caught") { ctx.fillStyle = `rgba(255,40,50,${Math.max(0, 0.25 - (beat.t % 0.45) * 0.5)})`; ctx.fillRect(0, 0, VW, VH); }
}
function drawThief() {
  const t = thief, x = t.x, y = t.y;
  if (t.hidden) { ctx.fillStyle = "rgba(169,188,255,.8)"; ctx.font = "800 9px system-ui"; ctx.textAlign = "center"; ctx.fillText("hiding…", t.hidden.x + t.hidden.w / 2, t.hidden.y - 6); ctx.textAlign = "start"; return; }
  const hurt = state === "caught" ? Math.sin(beat.t * 30) * 2 : 0;
  ctx.save(); ctx.translate(x + hurt, y); ctx.rotate(t.face);
  // loot bag gets bigger as you go
  const bag = 4 + Math.min(6, got / Math.max(1, total) * 6);
  ctx.fillStyle = "#7a6248"; ctx.beginPath(); ctx.arc(-9, 4, bag, 0, 7); ctx.fill();
  // feet
  const sw = Math.sin(t.step) * 3;
  ctx.fillStyle = "#1a1a22"; ctx.beginPath(); ctx.ellipse(2 + sw, -5, 3.5, 2.5, 0, 0, 7); ctx.ellipse(2 - sw, 5, 3.5, 2.5, 0, 0, 7); ctx.fill();
  // striped body
  ctx.fillStyle = "#e8e8f0"; ctx.beginPath(); ctx.arc(0, 0, 9, 0, 7); ctx.fill();
  ctx.fillStyle = "#1a1a22"; for (let k = -6; k <= 6; k += 4) ctx.fillRect(k - 1, -8, 2, 16);
  // head with mask band
  ctx.fillStyle = "#e3b48c"; ctx.beginPath(); ctx.arc(1.5, 0, 5.5, 0, 7); ctx.fill();
  ctx.fillStyle = "#14141c"; ctx.fillRect(2.5, -5, 2.6, 10); ctx.beginPath(); ctx.arc(-1, 0, 5.2, Math.PI * 0.5, Math.PI * 1.5); ctx.fill();
  ctx.restore();
  if (t.lit && state === "play") { ctx.fillStyle = "rgba(255,216,138,.9)"; ctx.font = "800 8px system-ui"; ctx.textAlign = "center"; ctx.fillText("in the light: slowed", x, y - 16); ctx.textAlign = "start"; }
}
function drawCop(c, vis) {
  ctx.globalAlpha = vis;
  ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.dir);
  const sw = Math.sin(c.step) * 3.5;
  ctx.fillStyle = "#0f1424"; ctx.beginPath(); ctx.ellipse(1 + sw, -6, 4, 3, 0, 0, 7); ctx.ellipse(1 - sw, 6, 4, 3, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#24345e"; ctx.beginPath(); ctx.arc(0, 0, 10.5, 0, 7); ctx.fill();          // uniform
  ctx.fillStyle = "#e9c46a"; ctx.beginPath(); ctx.arc(4, -5, 1.8, 0, 7); ctx.fill();            // badge
  // torch arm
  ctx.fillStyle = "#24345e"; ctx.fillRect(4, 5, 10, 4); ctx.fillStyle = "#c9c9c9"; ctx.fillRect(12, 4.5, 6, 5); ctx.fillStyle = "#fff4cf"; ctx.fillRect(17.5, 5, 1.5, 4);
  // stick: on the hip, or swinging when you're caught
  ctx.save();
  if (state === "caught" && beat && beat.cop === c) { const ph = (beat.t * 2.3) % 1; ctx.translate(4, -6); ctx.rotate(-1.4 + Math.sin(ph * Math.PI) * 2.2); ctx.fillStyle = "#3a2a1a"; ctx.fillRect(0, -1.5, 20, 3); }
  else { ctx.fillStyle = "#3a2a1a"; ctx.fillRect(-8, -10, 14, 2.5); }
  ctx.restore();
  // cap
  ctx.fillStyle = "#121a33"; ctx.beginPath(); ctx.arc(0, 0, 6.5, 0, 7); ctx.fill(); ctx.fillStyle = "#0b1022"; ctx.fillRect(4, -5, 4, 10);
  ctx.restore();
  ctx.globalAlpha = 1;
  if (c.markT > 0 || c.state === "chase" || c.state === "search" || c.knows) {
    const m = c.state === "chase" || c.knows ? "!" : c.state === "search" || c.state === "investigate" ? "?" : c.mark;
    if (m) { ctx.font = "900 15px system-ui"; ctx.textAlign = "center"; ctx.fillStyle = m === "!" ? "#ff5a5f" : "#ffd88a"; ctx.fillText(m, c.x, c.y - 17 - Math.abs(Math.sin(clock * 6)) * 2); ctx.textAlign = "start"; }
  }
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

// ---------- loop ----------
let last = performance.now();
function frame(now) { const dt = Math.min(0.033, (now - last) / 1000); last = now; update(dt); render(); requestAnimationFrame(frame); }
resize();
// a quiet apartment behind the title card
CFG = levelCfg(1); genApartment(1); { const r = rooms[0], p = freeSpot(r); thief = { x: p.x, y: p.y, vx: 0, vy: 0, face: 0, step: 0, hidden: null, lit: false }; }
cops = [makeCop(rooms[rooms.length - 1].cx, rooms[rooms.length - 1].cy)]; coins = []; memory = document.createElement("canvas"); memory.width = 4; memory.height = 4; mctx = memory.getContext("2d");
cam.x = thief.x; cam.y = thief.y;
updateHud(); showTitle(); requestAnimationFrame(frame);
setInterval(() => { if (state === "title" && cops[0]) { const c = cops[0]; c.dir += 0.02; } }, 16);

// ======================================================================
// INPUT: keyboard, and a real joystick + RUN + HIDE on phones
// ======================================================================
const KM = { KeyW: "w", ArrowUp: "w", KeyA: "a", ArrowLeft: "a", KeyS: "s", ArrowDown: "s", KeyD: "d", ArrowRight: "d" };
addEventListener("keydown", (e) => {
  if (KM[e.code] || e.code === "Space") e.preventDefault();
  if (e.code === "KeyM") return toggleSnd();
  if (e.code === "ShiftLeft" || e.code === "ShiftRight") keys.shift = true;
  if (KM[e.code]) keys[KM[e.code]] = true;
  if ((e.code === "KeyE" || e.code === "Space") && !e.repeat) {
    if (state === "play") toggleHide();
    else if (ui.ov.classList.contains("show")) { const b = ui.card.querySelector("[data-a]"); if (b) b.click(); }
  }
  if (e.code === "Enter" && ui.ov.classList.contains("show")) { const b = ui.card.querySelector("[data-a]"); if (b) b.click(); }
  if ((e.code === "KeyP" || e.code === "Escape") && state === "play") pause();
});
addEventListener("keyup", (e) => { if (KM[e.code]) keys[KM[e.code]] = false; if (e.code === "ShiftLeft" || e.code === "ShiftRight") keys.shift = false; });
addEventListener("blur", () => { for (const k in keys) keys[k] = false; input.x = input.y = 0; input.run = false; });
function pause() { if (state !== "play") return; setState("paused"); showCard(`<div class="kicker">Paused</div><h1>Holding your breath…</h1><button class="go" data-a="resume">Resume</button>`); }
document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });

const joy = $("#joy"), knob = $("#knob"), runB = $("#run"), hideB = $("#hide");
let joyId = null;
function joyMove(e) {
  const r = joy.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, max = r.width * 0.36;
  let dx = e.clientX - cx, dy = e.clientY - cy; const d = Math.hypot(dx, dy);
  if (d > max) { dx *= max / d; dy *= max / d; }
  knob.style.transform = `translate(${dx}px, ${dy}px)`;
  const m = Math.min(1, d / max); input.x = m < 0.15 ? 0 : dx / max; input.y = m < 0.15 ? 0 : dy / max;
}
joy.addEventListener("pointerdown", (e) => { e.preventDefault(); joyId = e.pointerId; try { joy.setPointerCapture(e.pointerId); } catch (_) {} joyMove(e); });
joy.addEventListener("pointermove", (e) => { if (e.pointerId === joyId) joyMove(e); });
const joyEnd = (e) => { if (e.pointerId !== joyId) return; joyId = null; input.x = input.y = 0; knob.style.transform = ""; };
joy.addEventListener("pointerup", joyEnd); joy.addEventListener("pointercancel", joyEnd);
runB.addEventListener("pointerdown", (e) => { e.preventDefault(); try { runB.setPointerCapture(e.pointerId); } catch (_) {} input.run = true; runB.classList.add("on"); });
const runEnd = () => { input.run = false; runB.classList.remove("on"); };
runB.addEventListener("pointerup", runEnd); runB.addEventListener("pointercancel", runEnd);
hideB.addEventListener("pointerdown", (e) => { e.preventDefault(); toggleHide(); updateHud(); });

if (location.search.includes("debug")) window.__lf = {
  get: () => ({ state, level, got, total, rooms: rooms.length, doors: doors.length, walls: walls.length, wardrobes: wardrobes.length, cops: cops.map((c) => c.state), hidden: !!thief.hidden, lit: thief.lit, x: Math.round(thief.x), y: Math.round(thief.y) }),
  world: () => ({ AW, AH, rooms, doors, walls, furn, wardrobes, coins }), thief: () => thief, cops: () => cops, input, keys, toggleHide, startLevel, los, canSee, roomAt,
  cfg: () => CFG,
};
})();
</script>
