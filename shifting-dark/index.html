<script>
(() => {
"use strict";

// ---------- storage ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

// ---------- tuning ----------
const PLAYER_R = 0.28;                 // in cells
const TORCH_R0 = 3 * (PLAYER_R * 2);   // torch radius = 3x the player's width
const BASE_SPEED = 4.2;                // cells per second
const DOOR_PERIOD = 30;
const MEMORY_FADE = 7;                 // seconds remembered walls linger
const CHARMS = {
  ember: { name: "Ember",     desc: "your torch blazes brighter", good: true,  dur: 8 },
  ash:   { name: "Ash",       desc: "your torch gutters low",     good: false, dur: 9 },
  swift: { name: "Swiftfoot", desc: "your feet feel light",       good: true,  dur: 6 },
  mire:  { name: "Mire",      desc: "the floor drags at you",     good: false, dur: 6 },
};
const CHARM_KEYS = Object.keys(CHARMS);
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];

function levelParams(L) {
  const size = Math.min(9 + 2 * (L - 1), 35);
  return {
    W: size, H: size,
    loops: Math.max(0.03, 0.26 - 0.025 * (L - 1)), // fewer openings = more walls each level
    charms: Math.min(3 + L, 16),
  };
}

// ---------- DOM ----------
const $ = (s) => document.querySelector(s);
const cv = $("#c"), ctx = cv.getContext("2d");
const ui = { lv: $("#lv"), tm: $("#tm"), best: $("#best"), door: $("#door"), fx: $("#fx"), toast: $("#toast"),
             ov: $("#ov"), card: $("#card"), snd: $("#snd"), rst: $("#rst"), hint: $("#hint") };
const isTouch = matchMedia("(pointer: coarse)").matches || "ontouchstart" in window;
if (isTouch) document.body.classList.add("touch");
ui.hint.textContent = isTouch ? "swipe to run · tap to stop" : "arrows / WASD";

let DPR = 1, VW = 0, VH = 0;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = innerWidth; VH = innerHeight;
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  cv.style.width = VW + "px"; cv.style.height = VH + "px";
}
addEventListener("resize", resize); resize();

// ---------- audio ----------
let AC = null, muted = store.get("sd.muted", false);
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (AC.state === "suspended") AC.resume();
  return AC;
}
function tone(f, dur, type = "sine", vol = 0.12, slide = 0, delay = 0) {
  if (muted) return; const a = audio(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}
function rumble(vol = 0.22) {
  if (muted) return; const a = audio(); if (!a) return;
  const len = a.sampleRate * 0.9, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = a.createBufferSource(), lp = a.createBiquadFilter(), g = a.createGain();
  src.buffer = buf; lp.type = "lowpass"; lp.frequency.value = 160; g.gain.value = vol;
  src.connect(lp).connect(g).connect(a.destination); src.start();
}
const sfx = {
  good() { tone(523, 0.12, "triangle", 0.12); tone(784, 0.2, "triangle", 0.12, 0, 0.08); tone(1046, 0.25, "triangle", 0.08, 0, 0.16); },
  bad()  { tone(320, 0.35, "sawtooth", 0.07, 0.45); tone(160, 0.4, "square", 0.04, 0.6, 0.05); },
  shift(){ rumble(0.18); },
  door() { tone(82, 1.4, "sine", 0.22, 0.75); tone(123, 1.1, "sine", 0.08, 0.7, 0.05); },
  win()  { [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, 0.22, "square", 0.06, 0, i * 0.09)); },
};
function syncSnd() { ui.snd.textContent = muted ? "×" : "♪"; ui.snd.style.opacity = muted ? 0.5 : 1; }
syncSnd();
ui.snd.addEventListener("click", (e) => { e.stopPropagation(); muted = !muted; store.set("sd.muted", muted); syncSnd(); if (!muted) audio(); });

// ---------- maze data ----------
// hw[y*W+x]   = wall on the TOP edge of cell (x,y), y in 0..H
// vw[y*(W+1)+x] = wall on the LEFT edge of cell (x,y), x in 0..W
let W, H, hw, vw;
let sT, sI, sX, sY, sA, sB, NS; // interior wall slots
let memH, memHS, memV, memVS;    // memory: time last seen + state seen

const rand = (n) => (Math.random() * n) | 0;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function canMove(x, y, d) {
  switch (d) {
    case 0: return y > 0 && !hw[y * W + x];
    case 1: return x < W - 1 && !vw[y * (W + 1) + x + 1];
    case 2: return y < H - 1 && !hw[(y + 1) * W + x];
    case 3: return x > 0 && !vw[y * (W + 1) + x];
  }
  return false;
}
function setWall(x, y, d, v) {
  if (d === 0) hw[y * W + x] = v; else if (d === 1) vw[y * (W + 1) + x + 1] = v;
  else if (d === 2) hw[(y + 1) * W + x] = v; else vw[y * (W + 1) + x] = v;
}
const getS = (k) => (sT[k] ? vw[sI[k]] : hw[sI[k]]);
const setS = (k, v) => { if (sT[k]) vw[sI[k]] = v; else hw[sI[k]] = v; };
function segD(k, px, py) {
  return sT[k]
    ? Math.hypot(Math.abs(px - sX[k]), Math.max(Math.abs(py - sY[k]) - 0.5, 0))
    : Math.hypot(Math.max(Math.abs(px - sX[k]) - 0.5, 0), Math.abs(py - sY[k]));
}

function buildSlots() {
  NS = (H - 1) * W + H * (W - 1);
  sT = new Uint8Array(NS); sI = new Int32Array(NS); sX = new Float32Array(NS); sY = new Float32Array(NS);
  sA = new Int32Array(NS); sB = new Int32Array(NS);
  let k = 0;
  for (let y = 1; y < H; y++) for (let x = 0; x < W; x++, k++) {
    sT[k] = 0; sI[k] = y * W + x; sX[k] = x + 0.5; sY[k] = y; sA[k] = (y - 1) * W + x; sB[k] = y * W + x;
  }
  for (let y = 0; y < H; y++) for (let x = 1; x < W; x++, k++) {
    sT[k] = 1; sI[k] = y * (W + 1) + x; sX[k] = x; sY[k] = y + 0.5; sA[k] = y * W + x - 1; sB[k] = y * W + x;
  }
}

function genMaze(loops) {
  hw = new Uint8Array((H + 1) * W).fill(1);
  vw = new Uint8Array(H * (W + 1)).fill(1);
  const vis = new Uint8Array(W * H), st = [[rand(W), rand(H)]];
  vis[st[0][1] * W + st[0][0]] = 1;
  while (st.length) {
    const [x, y] = st[st.length - 1], opts = [];
    for (let d = 0; d < 4; d++) {
      const nx = x + DX[d], ny = y + DY[d];
      if (nx >= 0 && ny >= 0 && nx < W && ny < H && !vis[ny * W + nx]) opts.push(d);
    }
    if (!opts.length) { st.pop(); continue; }
    const d = opts[rand(opts.length)], nx = x + DX[d], ny = y + DY[d];
    setWall(x, y, d, 0); vis[ny * W + nx] = 1; st.push([nx, ny]);
  }
  buildSlots();
  const walls = [];
  for (let k = 0; k < NS; k++) if (getS(k)) walls.push(k);
  shuffle(walls);
  const n = Math.floor(walls.length * loops);
  for (let i = 0; i < n; i++) setS(walls[i], 0);
  memH = new Float32Array(hw.length).fill(-99); memHS = new Uint8Array(hw.length);
  memV = new Float32Array(vw.length).fill(-99); memVS = new Uint8Array(vw.length);
}

function bfs(starts) {
  const dist = new Int32Array(W * H).fill(-1), q = [];
  for (const [x, y] of starts) { const i = y * W + x; if (dist[i] < 0) { dist[i] = 0; q.push(i); } }
  for (let h = 0; h < q.length; h++) {
    const i = q[h], x = i % W, y = (i / W) | 0;
    for (let d = 0; d < 4; d++) if (canMove(x, y, d)) {
      const j = (y + DY[d]) * W + x + DX[d];
      if (dist[j] < 0) { dist[j] = dist[i] + 1; q.push(j); }
    }
  }
  return dist;
}

// ---------- game state ----------
let level = Math.max(1, store.get("sd.level", 1) | 0);
let best = store.get("sd.best", {}) || {};
let state = "title";
let P, door, charms, eff, torch, runTime, shiftTimer, doorTimer, doorPending, clock = 0;
let cam = { x: 0, y: 0 }, shake = 0, wonAt = 0, particles = [];
let params;

function ppos() { return { x: P.cx + (P.tx - P.cx) * P.t + 0.5, y: P.cy + (P.ty - P.cy) * P.t + 0.5 }; }
function torchR() { return TORCH_R0 * torch; }
function litR() { return torchR() * 1.06; }
function seen(x, y) { const p = ppos(); return Math.hypot(x + 0.5 - p.x, y + 0.5 - p.y) < litR() + 0.5; }
function occupied(x, y) {
  if (door && door.x === x && door.y === y) return true;
  return charms.some((c) => c.x === x && c.y === y);
}
function randomDarkCell(reach, minDist) {
  const p = ppos(), R = litR();
  for (let pass = 0; pass < 3; pass++) {
    const md = pass === 0 ? minDist : pass === 1 ? minDist * 0.5 : 0;
    for (let i = 0; i < 500; i++) {
      const x = rand(W), y = rand(H);
      if (reach && reach[y * W + x] < 0) continue;
      if (x === P.cx && y === P.cy) continue;
      const d = Math.hypot(x + 0.5 - p.x, y + 0.5 - p.y);
      if (d < R + 1.2 || d < md || occupied(x, y)) continue;
      return { x, y };
    }
  }
  return null;
}

function newLevel() {
  params = levelParams(level);
  W = params.W; H = params.H;
  genMaze(params.loops);
  const sx = rand(W), sy = rand(H);
  P = { cx: sx, cy: sy, tx: sx, ty: sy, t: 0, moving: false, dir: -1, face: 1 };
  eff = { ember: 0, ash: 0, swift: 0, mire: 0 };
  torch = 1; runTime = 0; doorTimer = DOOR_PERIOD; doorPending = false;
  shiftTimer = 5 + Math.random() * 5;
  charms = []; particles = [];
  // door: somewhere far along the actual path
  const dist = bfs([[sx, sy]]);
  let max = 0; for (const v of dist) if (v > max) max = v;
  const far = []; for (let i = 0; i < dist.length; i++) if (dist[i] >= max * 0.7) far.push(i);
  const di = far[rand(far.length)]; door = { x: di % W, y: (di / W) | 0 };
  for (let i = 0; i < params.charms; i++) { const c = randomDarkCell(null, 2); if (c) charms.push(c); }
  const p = ppos(); cam.x = p.x; cam.y = p.y;
  heldDirs.length = 0; autoDir = -1;
  updateHud(true);
}

// ---------- the dark rewrites itself ----------
function shiftMaze() {
  const p = ppos(), R = litR() + 0.3;
  let wallCount = 0; for (let k = 0; k < NS; k++) wallCount += getS(k);
  const dark = new Uint8Array(NS), darkWalls = [], darkEmpty = [];
  for (let k = 0; k < NS; k++) if (segD(k, p.x, p.y) > R) {
    dark[k] = 1; (getS(k) ? darkWalls : darkEmpty).push(k);
  }
  shuffle(darkWalls);
  // each dark wall: 50/50 whether it slides to a nearby empty spot in the dark
  for (const k of darkWalls) {
    if (Math.random() >= 0.5) continue;
    const cand = [];
    for (const e of darkEmpty) {
      if (getS(e)) continue;
      if (Math.abs(sX[e] - sX[k]) <= 2.5 && Math.abs(sY[e] - sY[k]) <= 2.5) cand.push(e);
    }
    if (!cand.length) continue;
    setS(k, 0); setS(cand[rand(cand.length)], 1);
  }
  // guarantee: every cell stays reachable (only dark walls may open)
  const starts = [[P.cx, P.cy], [P.tx, P.ty]];
  let reach;
  for (let guard = 0; guard < W * H; guard++) {
    reach = bfs(starts);
    const cand = [];
    let missing = false;
    for (let k = 0; k < NS; k++) {
      if (!getS(k)) continue;
      const a = reach[sA[k]] >= 0, b = reach[sB[k]] >= 0;
      if (a !== b) { if (dark[k]) cand.push(k); missing = true; }
    }
    if (!missing || !cand.length) break;
    setS(cand[rand(cand.length)], 0);
  }
  // repairs opened walls; put the same number back in the dark where it cuts nothing off
  let count = 0; for (let k = 0; k < NS; k++) count += getS(k);
  for (let tries = 0; count < wallCount && tries < 80; tries++) {
    const k = darkEmpty[rand(darkEmpty.length)];
    if (k == null || getS(k)) continue;
    setS(k, 1);
    const r = bfs(starts);
    if (r[sA[k]] >= 0 && r[sB[k]] >= 0 && !r.some((v) => v < 0)) { count++; reach = r; } else setS(k, 0);
  }
  // charms in the dark wander off
  for (const c of charms) {
    if (seen(c.x, c.y)) continue;
    const n = randomDarkCell(reach, 0); if (n) { c.x = n.x; c.y = n.y; }
  }
  shake = 0.3; sfx.shift();
}

function moveDoor() {
  const reach = bfs([[P.cx, P.cy]]);
  const n = randomDarkCell(reach, Math.max(3, Math.hypot(W, H) * 0.45));
  if (n) { door.x = n.x; door.y = n.y; }
  doorTimer = DOOR_PERIOD; doorPending = false;
  sfx.door();
}

// ---------- input ----------
const heldDirs = []; let autoDir = -1;
const KEYMAP = { ArrowUp: 0, KeyW: 0, ArrowRight: 1, KeyD: 1, ArrowDown: 2, KeyS: 2, ArrowLeft: 3, KeyA: 3 };
const desired = () => (heldDirs.length ? heldDirs[heldDirs.length - 1] : autoDir);
function press(d) { const i = heldDirs.indexOf(d); if (i >= 0) heldDirs.splice(i, 1); heldDirs.push(d); autoDir = -1; }
function release(d) { const i = heldDirs.indexOf(d); if (i >= 0) heldDirs.splice(i, 1); }

addEventListener("keydown", (e) => {
  if (e.code in KEYMAP) e.preventDefault();
  if (state !== "play") { if (!e.repeat) overlayAdvance(); return; }
  if (e.code in KEYMAP && !e.repeat) press(KEYMAP[e.code]);
  if (e.code === "KeyM") ui.snd.click();
});
addEventListener("keyup", (e) => { if (e.code in KEYMAP) release(KEYMAP[e.code]); });
addEventListener("blur", () => { heldDirs.length = 0; });

let swipe = null;
cv.addEventListener("pointerdown", (e) => { swipe = { x: e.clientX, y: e.clientY }; });
cv.addEventListener("pointerup", (e) => {
  if (!swipe || state !== "play") { swipe = null; return; }
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y; swipe = null;
  if (Math.hypot(dx, dy) < 22) { autoDir = -1; return; }   // tap = stop
  autoDir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0);
});
document.querySelectorAll("#pad button").forEach((b) => {
  const d = +b.dataset.d;
  const on = (e) => { e.preventDefault(); b.setPointerCapture?.(e.pointerId); b.classList.add("on"); if (state === "play") press(d); };
  const off = () => { b.classList.remove("on"); release(d); };
  b.addEventListener("pointerdown", on);
  b.addEventListener("pointerup", off); b.addEventListener("pointercancel", off); b.addEventListener("lostpointercapture", off);
});
ui.ov.addEventListener("pointerdown", (e) => { e.preventDefault(); overlayAdvance(); });

let rstTimer = 0;
ui.rst.addEventListener("click", (e) => {
  e.stopPropagation();
  if (!ui.rst.classList.contains("armed")) {
    ui.rst.classList.add("armed"); ui.rst.textContent = "SURE?";
    clearTimeout(rstTimer); rstTimer = setTimeout(() => { ui.rst.classList.remove("armed"); ui.rst.textContent = "↺"; }, 2500);
    return;
  }
  clearTimeout(rstTimer); ui.rst.classList.remove("armed"); ui.rst.textContent = "↺";
  level = 1; best = {}; store.set("sd.level", 1); store.set("sd.best", {});
  newLevel(); showTitle(); toast("progress reset", "");
});

document.addEventListener("visibilitychange", () => {
  if (document.hidden && state === "play") { state = "paused"; heldDirs.length = 0; showCard(`<h1>PAUSED</h1><p>The dark is waiting.</p><span class="go">PRESS ANY KEY / TAP</span>`); }
});

// ---------- overlays ----------
function showCard(html) { ui.card.innerHTML = html; ui.ov.classList.add("show"); }
function hideCard() { ui.ov.classList.remove("show"); }
function showTitle() {
  state = "title";
  const cont = level > 1 ? `<p>Continuing from <b>level ${level}</b>. Use ↺ to start over.</p>` : "";
  showCard(`
    <h1>THE SHIFTING<br><span>DARK</span></h1>
    <p>You have a torch. It shows you <b>almost nothing</b>.</p>
    <ul>
      <li>Find the <b>door</b> and step through it.</li>
      <li>Whatever sits in the dark <b>changes</b>: walls slide, charms wander.</li>
      <li>Every 30s the door moves, but never while you're looking at it.</li>
      <li>Charms might help you. They might not. You won't know until you touch one.</li>
      <li>The floor turns <b style="color:#c23a55">burgundy</b> as you get closer to the door.</li>
    </ul>
    ${cont}
    <span class="go">${isTouch ? "TAP TO ENTER" : "PRESS ANY KEY"}</span>`);
}
function overlayAdvance() {
  audio();
  if (state === "title" || state === "paused") { state = "play"; hideCard(); }
  else if (state === "won" && performance.now() - wonAt > 700) { newLevel(); state = "play"; hideCard(); }
}

function win() {
  state = "won"; wonAt = performance.now(); sfx.win();
  const t = runTime, prev = best[level];
  const record = prev == null || t < prev;
  if (record) { best[level] = t; store.set("sd.best", best); }
  const done = level;
  level++; store.set("sd.level", level);
  heldDirs.length = 0; autoDir = -1;
  showCard(`
    <h1>YOU <span>ESCAPED</span></h1>
    <p>Level ${done} cleared in</p>
    <div class="big">${fmt(t)}</div>
    <p>${record ? (prev == null ? "First escape on this level." : "<b>New best!</b> Previous: " + fmt(prev)) : "Best: " + fmt(prev)}</p>
    <p>Level ${level} has more walls. The dark is hungrier.</p>
    <span class="go">${isTouch ? "TAP" : "PRESS ANY KEY"} TO DESCEND</span>`);
}

// ---------- charms ----------
let toastT = 0;
function toast(msg, cls) {
  ui.toast.textContent = msg; ui.toast.className = "show " + (cls || "");
  clearTimeout(toastT); toastT = setTimeout(() => { ui.toast.className = ""; }, 2200);
}
function pickup(i) {
  const c = charms[i], key = CHARM_KEYS[rand(CHARM_KEYS.length)], info = CHARMS[key];
  eff[key] = info.dur;
  info.good ? sfx.good() : sfx.bad();
  toast(`${info.name}: ${info.desc}`, info.good ? "good" : "bad");
  burst(c.x + 0.5, c.y + 0.5, info.good ? "#7ae0b4" : "#ff5d3a");
  const n = randomDarkCell(bfs([[P.cx, P.cy]]), 3);
  if (n) { c.x = n.x; c.y = n.y; } else charms.splice(i, 1);
}
function burst(x, y, color) {
  for (let i = 0; i < 18; i++) {
    const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 2.5;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6 + Math.random() * 0.3, color });
  }
}

// ---------- update ----------
function speed() { return BASE_SPEED * (eff.swift > 0 ? 1.6 : 1) * (eff.mire > 0 ? 0.5 : 1); }
function go(d) { P.tx = P.cx + DX[d]; P.ty = P.cy + DY[d]; P.moving = true; P.dir = d; P.face = d; }
function tryStart(cont) {
  const d = desired();
  if (d >= 0 && canMove(P.cx, P.cy, d)) { go(d); return; }
  if (cont && d >= 0 && P.dir >= 0 && canMove(P.cx, P.cy, P.dir)) { go(P.dir); return; } // keep running, turn when possible
  if (d >= 0) P.face = d;
  P.moving = false; P.tx = P.cx; P.ty = P.cy; P.t = 0;
}
function arrive() {
  for (let i = charms.length - 1; i >= 0; i--) if (charms[i].x === P.cx && charms[i].y === P.cy) pickup(i);
  if (P.cx === door.x && P.cy === door.y) { win(); return true; }
  return false;
}

function update(dt) {
  clock += dt;
  for (const k of CHARM_KEYS) if (eff[k] > 0) eff[k] = Math.max(0, eff[k] - dt);
  let target = 1;
  if (eff.ember > 0) target *= 1.75;
  if (eff.ash > 0) target *= 1 - 0.55 * (eff.ash / CHARMS.ash.dur); // shrinks hard, regrows over time
  torch += (target - torch) * Math.min(1, dt * 5);

  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i]; q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.92; q.vy *= 0.92;
    if (q.life <= 0) particles.splice(i, 1);
  }
  shake = Math.max(0, shake - dt);
  if (state !== "play") return;

  runTime += dt;
  if (P.moving) {
    P.t += speed() * dt;
    if (P.t >= 1) {
      const left = P.t - 1;
      P.cx = P.tx; P.cy = P.ty; P.t = 0; P.moving = false;
      if (arrive()) return;
      tryStart(true);
      if (P.moving) P.t = Math.min(left, 0.99);
    }
  } else tryStart(false);

  shiftTimer -= dt;
  if (shiftTimer <= 0) { shiftMaze(); shiftTimer = 5 + Math.random() * 5; }
  doorTimer -= dt;
  if (doorTimer <= 0) doorPending = true;
  if (doorPending && !seen(door.x, door.y)) moveDoor();

  // remember what the torch touches
  const p = ppos(), Rm = torchR() * 0.9;
  const x0 = Math.max(0, Math.floor(p.x - Rm - 1)), x1 = Math.min(W - 1, Math.ceil(p.x + Rm + 1));
  const y0 = Math.max(0, Math.floor(p.y - Rm - 1)), y1 = Math.min(H - 1, Math.ceil(p.y + Rm + 1));
  for (let y = y0; y <= y1 + 1; y++) for (let x = x0; x <= x1; x++) {
    const i = y * W + x;
    if (Math.hypot(Math.max(Math.abs(p.x - x - 0.5) - 0.5, 0), Math.abs(p.y - y)) < Rm) { memH[i] = clock; memHS[i] = hw[i]; }
  }
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1 + 1; x++) {
    const i = y * (W + 1) + x;
    if (Math.hypot(Math.abs(p.x - x), Math.max(Math.abs(p.y - y - 0.5) - 0.5, 0)) < Rm) { memV[i] = clock; memVS[i] = vw[i]; }
  }
  updateHud(false);
}

// ---------- HUD ----------
function fmt(t) { const m = Math.floor(t / 60), s = t - m * 60; return `${m}:${s < 10 ? "0" : ""}${s.toFixed(1)}`; }
let lastFx = "";
function updateHud(force) {
  ui.lv.textContent = "LV " + level;
  ui.tm.textContent = fmt(runTime || 0);
  ui.best.textContent = best[level] != null ? "BEST " + fmt(best[level]) : "";
  if (doorPending) { ui.door.textContent = "the door is restless… it moves when you look away"; ui.door.className = "wait"; }
  else { ui.door.textContent = `door shifts in ${Math.ceil(doorTimer)}s`; ui.door.className = ""; }
  const parts = [];
  for (const k of CHARM_KEYS) if (eff[k] > 0) parts.push(`<span class="fx ${CHARMS[k].good ? "good" : "bad"}">${CHARMS[k].name} ${Math.ceil(eff[k])}s</span>`);
  const html = parts.join("");
  if (force || html !== lastFx) { ui.fx.innerHTML = html; lastFx = html; }
}

// ---------- render ----------
const FLOOR_A = [22, 20, 28], FLOOR_B = [128, 14, 42];
function floorColor(x, y) {
  const maxD = Math.hypot(W, H) * 0.75;
  let k = 1 - Math.hypot(x - door.x, y - door.y) / maxD;
  k = Math.max(0, Math.min(1, k)); k = k * k;
  const n = (((x * 73856093) ^ (y * 19349663)) & 7) - 3;
  const r = FLOOR_A[0] + (FLOOR_B[0] - FLOOR_A[0]) * k + n;
  const g = FLOOR_A[1] + (FLOOR_B[1] - FLOOR_A[1]) * k + n;
  const b = FLOOR_A[2] + (FLOOR_B[2] - FLOOR_A[2]) * k + n;
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, VW, VH);
  if (!P) return;
  const cs = Math.min(VW, VH) / 8.5;
  const p = ppos();
  cam.x += (p.x - cam.x) * 0.18; cam.y += (p.y - cam.y) * 0.18;
  const sh = shake > 0 ? shake * 10 : 0;
  const ox = VW / 2 - cam.x * cs + (Math.random() - 0.5) * sh, oy = VH / 2 - cam.y * cs + (Math.random() - 0.5) * sh;
  const flick = 1 + 0.025 * Math.sin(clock * 13) + 0.02 * Math.sin(clock * 7.3 + 1) + 0.01 * Math.sin(clock * 31);
  const R = torchR(), Rf = R * flick;
  const px = ox + p.x * cs, py = oy + p.y * cs;

  // floor in torchlight
  const x0 = Math.max(0, Math.floor(p.x - R - 1)), x1 = Math.min(W - 1, Math.ceil(p.x + R + 1));
  const y0 = Math.max(0, Math.floor(p.y - R - 1)), y1 = Math.min(H - 1, Math.ceil(p.y + R + 1));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    if (Math.hypot(x + 0.5 - p.x, y + 0.5 - p.y) > R + 0.9) continue;
    ctx.fillStyle = floorColor(x, y);
    ctx.fillRect(Math.floor(ox + x * cs), Math.floor(oy + y * cs), Math.ceil(cs) + 1, Math.ceil(cs) + 1);
  }
  // warm glow
  const glow = ctx.createRadialGradient(px, py, 0, px, py, Rf * cs);
  glow.addColorStop(0, "rgba(255,170,80,0.16)"); glow.addColorStop(1, "rgba(255,120,40,0)");
  ctx.fillStyle = glow; ctx.fillRect(px - Rf * cs, py - Rf * cs, Rf * cs * 2, Rf * cs * 2);

  // door
  if (Math.hypot(door.x + 0.5 - p.x, door.y + 0.5 - p.y) < R + 1) drawDoor(ox + (door.x + 0.5) * cs, oy + (door.y + 0.5) * cs, cs);
  // charms
  for (const c of charms) if (Math.hypot(c.x + 0.5 - p.x, c.y + 0.5 - p.y) < R + 1) drawCharm(ox + (c.x + 0.5) * cs, oy + (c.y + 0.5) * cs, cs, c.x * 7 + c.y * 3);

  // walls in torchlight
  ctx.lineCap = "round";
  const wallPath = () => {
    ctx.beginPath();
    for (let y = y0; y <= y1 + 1; y++) for (let x = x0; x <= x1; x++) {
      if (!hw[y * W + x]) continue;
      if (Math.hypot(Math.max(Math.abs(p.x - x - 0.5) - 0.5, 0), Math.abs(p.y - y)) > R + 0.5) continue;
      ctx.moveTo(ox + x * cs, oy + y * cs); ctx.lineTo(ox + (x + 1) * cs, oy + y * cs);
    }
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1 + 1; x++) {
      if (!vw[y * (W + 1) + x]) continue;
      if (Math.hypot(Math.abs(p.x - x), Math.max(Math.abs(p.y - y - 0.5) - 0.5, 0)) > R + 0.5) continue;
      ctx.moveTo(ox + x * cs, oy + y * cs); ctx.lineTo(ox + x * cs, oy + (y + 1) * cs);
    }
  };
  ctx.save(); ctx.translate(0, cs * 0.05); wallPath(); ctx.strokeStyle = "#3b2f22"; ctx.lineWidth = cs * 0.17; ctx.stroke(); ctx.restore();
  wallPath(); ctx.strokeStyle = "#d9c49b"; ctx.lineWidth = cs * 0.15; ctx.stroke();

  // particles
  for (const q of particles) {
    ctx.globalAlpha = Math.max(0, q.life / 0.9); ctx.fillStyle = q.color;
    ctx.fillRect(ox + q.x * cs - 2, oy + q.y * cs - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  // darkness
  const dark = ctx.createRadialGradient(px, py, 0, px, py, Rf * cs);
  dark.addColorStop(0, "rgba(0,0,0,0)"); dark.addColorStop(0.45, "rgba(0,0,0,0.04)");
  dark.addColorStop(0.78, "rgba(0,0,0,0.55)"); dark.addColorStop(1, "rgba(0,0,0,1)");
  ctx.fillStyle = dark; ctx.fillRect(0, 0, VW, VH);

  // memory: faint outlines of walls you saw recently. They may already be lies.
  const vx0 = Math.max(0, Math.floor(cam.x - VW / cs / 2) - 1), vx1 = Math.min(W - 1, Math.ceil(cam.x + VW / cs / 2) + 1);
  const vy0 = Math.max(0, Math.floor(cam.y - VH / cs / 2) - 1), vy1 = Math.min(H - 1, Math.ceil(cam.y + VH / cs / 2) + 1);
  ctx.strokeStyle = "#7d8cb3"; ctx.lineWidth = Math.max(1.5, cs * 0.05);
  const Rv = R * 0.85;
  for (let y = vy0; y <= vy1 + 1; y++) for (let x = vx0; x <= vx1; x++) {
    const i = y * W + x, age = clock - memH[i];
    if (!memHS[i] || age > MEMORY_FADE) continue;
    if (Math.hypot(Math.max(Math.abs(p.x - x - 0.5) - 0.5, 0), Math.abs(p.y - y)) < Rv) continue;
    ctx.globalAlpha = 0.38 * (1 - age / MEMORY_FADE);
    ctx.beginPath(); ctx.moveTo(ox + x * cs, oy + y * cs); ctx.lineTo(ox + (x + 1) * cs, oy + y * cs); ctx.stroke();
  }
  for (let y = vy0; y <= vy1; y++) for (let x = vx0; x <= vx1 + 1; x++) {
    const i = y * (W + 1) + x, age = clock - memV[i];
    if (!memVS[i] || age > MEMORY_FADE) continue;
    if (Math.hypot(Math.abs(p.x - x), Math.max(Math.abs(p.y - y - 0.5) - 0.5, 0)) < Rv) continue;
    ctx.globalAlpha = 0.38 * (1 - age / MEMORY_FADE);
    ctx.beginPath(); ctx.moveTo(ox + x * cs, oy + y * cs); ctx.lineTo(ox + x * cs, oy + (y + 1) * cs); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  drawPlayer(px, py, cs);
}

function drawDoor(x, y, cs) {
  const w = cs * 0.6, h = cs * 0.76, top = y - h / 2, pulse = 0.5 + 0.5 * Math.sin(clock * 3);
  const g = ctx.createRadialGradient(x, y, 0, x, y, cs * 0.9);
  g.addColorStop(0, `rgba(255,210,130,${0.25 + 0.2 * pulse})`); g.addColorStop(1, "rgba(255,210,130,0)");
  ctx.fillStyle = g; ctx.fillRect(x - cs, y - cs, cs * 2, cs * 2);
  ctx.beginPath();
  ctx.moveTo(x - w / 2, y + h / 2); ctx.lineTo(x - w / 2, top + w / 2);
  ctx.arc(x, top + w / 2, w / 2, Math.PI, 0); ctx.lineTo(x + w / 2, y + h / 2); ctx.closePath();
  ctx.fillStyle = "#5a3418"; ctx.fill();
  ctx.lineWidth = cs * 0.06; ctx.strokeStyle = "#c9a24a"; ctx.stroke();
  ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.lineWidth = cs * 0.025;
  ctx.beginPath(); ctx.moveTo(x - w / 6, top + w / 3); ctx.lineTo(x - w / 6, y + h / 2); ctx.moveTo(x + w / 6, top + w / 3); ctx.lineTo(x + w / 6, y + h / 2); ctx.stroke();
  ctx.fillStyle = "#ffd166"; ctx.beginPath(); ctx.arc(x + w * 0.3, y + h * 0.08, cs * 0.045, 0, Math.PI * 2); ctx.fill();
}

function drawCharm(x, y, cs, seed) {
  const bob = Math.sin(clock * 3 + seed) * cs * 0.05, r = cs * 0.14;
  y += bob;
  const g = ctx.createRadialGradient(x, y, 0, x, y, cs * 0.45);
  g.addColorStop(0, "rgba(190,140,255,0.55)"); g.addColorStop(1, "rgba(150,90,255,0)");
  ctx.fillStyle = g; ctx.fillRect(x - cs * 0.5, y - cs * 0.5, cs, cs);
  ctx.fillStyle = "#b48cff"; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.save(); ctx.translate(x, y); ctx.rotate(clock * 1.5 + seed);
  ctx.strokeStyle = "#fff"; ctx.lineWidth = Math.max(1, cs * 0.025); ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = (i * 4 * Math.PI) / 5 - Math.PI / 2, rr = r * 0.7;
    i ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.stroke(); ctx.restore();
}

function drawPlayer(x, y, cs) {
  const r = cs * PLAYER_R, ang = [-Math.PI / 2, 0, Math.PI / 2, Math.PI][P.face];
  const mouth = P.moving ? 0.05 + 0.3 * Math.abs(Math.sin(clock * 14)) : 0.18;
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.fillStyle = "#ffd23f";
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r, mouth * Math.PI, (2 - mouth) * Math.PI); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#14110f"; ctx.beginPath(); ctx.arc(r * 0.15, -r * 0.5, r * 0.13, 0, Math.PI * 2); ctx.fill();
  // little torch flame
  const fl = 0.8 + 0.2 * Math.sin(clock * 20);
  ctx.fillStyle = "#ff8a3a"; ctx.beginPath(); ctx.arc(-r * 0.75, -r * 0.75, r * 0.22 * fl, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ffe08a"; ctx.beginPath(); ctx.arc(-r * 0.75, -r * 0.75, r * 0.11 * fl, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(frame);
}
newLevel(); showTitle();
requestAnimationFrame(frame);
if (location.search.includes("debug")) window.__sd = { shiftMaze, moveDoor, bfs, get: () => ({ W, H, P, door, charms, level, state, NS, getS }) };
})();
</script>
<script data-goatcounter="https://sakhadib.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
