<body>
<canvas id="c"></canvas>
<div id="hud">
  <div><div id="depth">0<small>m</small></div><div class="sub"><span id="score">0</span><span id="lives"></span></div></div>
  <div class="right">
    <div class="btns"><button class="btn" id="snd" title="Sound (M)">♪</button><a class="btn" href="../" title="Back to The Oven">⌂</a></div>
    <div id="best">BEST 0</div>
  </div>
</div>
<div id="fx"></div>
<div id="ov" class="show"><div class="card" id="card"></div></div>

<script>
(() => {
"use strict";
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const isTouch = matchMedia("(pointer: coarse)").matches || "ontouchstart" in window;
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);

// ---------- canvas: a 360-unit-wide playfield, as tall as the screen allows ----------
const LW = 360;
const cv = $("#c"), ctx = cv.getContext("2d");
let DPR = 1, VW = 0, VH = 0, S = 1, FH = 640, OX = 0;
function resize() {
  DPR = Math.min(2, devicePixelRatio || 1); VW = innerWidth; VH = innerHeight;
  cv.width = VW * DPR; cv.height = VH * DPR; cv.style.width = VW + "px"; cv.style.height = VH + "px";
  S = Math.min(VW / LW, VH / 600); FH = VH / S; OX = (VW - LW * S) / 2;
  document.documentElement.style.setProperty("--fw", LW * S + "px"); document.documentElement.style.setProperty("--s", S);
}
addEventListener("resize", resize); resize();

// ---------- audio ----------
let AC = null, muted = store.get("rr.muted", false);
function tone(f, dur, type = "sine", vol = 0.1, slide = 0, delay = 0) {
  if (muted) return;
  try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  if (AC.state === "suspended") AC.resume();
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.05);
}
const sfx = {
  land(c) { tone(180 + c * 30, 0.07, "triangle", 0.07, 0.7); },
  coin(n) { tone(880 * Math.pow(2, Math.min(n, 12) / 12), 0.12, "sine", 0.05); tone(1320 * Math.pow(2, Math.min(n, 12) / 12), 0.14, "sine", 0.03, 0, 0.04); },
  spring() { tone(300, 0.25, "sine", 0.1, 3); },
  crumble() { tone(160, 0.18, "triangle", 0.05, 0.6); },
  combo(n) { [0, 4, 7, 12].slice(0, Math.min(4, n)).forEach((s, i) => tone(523 * Math.pow(2, s / 12), 0.1, "triangle", 0.08, 0, i * 0.06)); },
  close() { tone(784, 0.12, "sine", 0.05); tone(1046, 0.16, "sine", 0.05, 0, 0.08); },
  hit() { tone(330, 0.35, "triangle", 0.08, 0.5); tone(110, 0.35, "sine", 0.1, 0.6); },
  power() { [660, 880, 1320].forEach((f, i) => tone(f, 0.1, "triangle", 0.08, 0, i * 0.06)); },
  zone() { [392, 523, 659, 784].forEach((f, i) => tone(f, 0.16, "triangle", 0.07, 0, i * 0.1)); },
  over() { [440, 349, 262, 196].forEach((f, i) => tone(f, 0.2, "triangle", 0.08, 0, i * 0.16)); },
  ok() { tone(880, 0.06, "triangle", 0.06); },
};
const sndBtn = $("#snd");
function syncSnd() { sndBtn.textContent = muted ? "×" : "♪"; sndBtn.style.opacity = muted ? 0.6 : 1; }
function toggleSnd() { muted = !muted; store.set("rr.muted", muted); syncSnd(); if (!muted) sfx.ok(); }
syncSnd(); sndBtn.addEventListener("click", (e) => { e.stopPropagation(); toggleSnd(); });

// ---------- zones ----------
// each zone adds a platform type and a new colour scheme
const ZONES = [
  { name: "Dawn Drift",     bg: ["#dfe7f3", "#f3e3dc"], plat: "#5c6f91", ink: "#2b2d42", types: { n: 1 } },
  { name: "Crumble Canyon", bg: ["#f1e4d3", "#e9d2bd"], plat: "#7d6450", ink: "#3d2f25", types: { n: 1, c: 0.45 } },
  { name: "Spring Meadow",  bg: ["#dcebdd", "#eef2df"], plat: "#4f7d63", ink: "#26392e", types: { n: 1, c: 0.3, b: 0.4 } },
  { name: "Quiet Factory",  bg: ["#e2e3ea", "#d3d7e0"], plat: "#56607a", ink: "#2b2f3d", types: { n: 1, c: 0.3, b: 0.3, v: 0.45 } },
  { name: "Frost Hollow",   bg: ["#dcecf3", "#ebf3f6"], plat: "#4a7a93", ink: "#203845", types: { n: 0.8, c: 0.3, b: 0.3, v: 0.3, i: 0.5, m: 0.4 } },
  { name: "Twilight",       bg: ["#3d3c5c", "#2c2b45"], plat: "#c3bdf0", ink: "#f1eefc", types: { n: 0.7, c: 0.4, b: 0.35, v: 0.35, i: 0.4, m: 0.5 } },
];
const TYPE_COL = { c: "#c79a6e", b: "#78ad86", v: "#8f9bb8", i: "#9ccbe0", m: "#a58fc7" };
const ZONE_LEN = 200; // metres
const zoneOf = (m) => Math.min(ZONES.length - 1, Math.floor(m / ZONE_LEN));
function pick(types) { let t = 0; for (const k in types) t += types[k]; let r = Math.random() * t; for (const k in types) { r -= types[k]; if (r <= 0) return k; } return "n"; }

// ---------- state ----------
const R = 10, GRAV = 950, MAXFALL = 560, ACC = 1400, MAXVX = 190, ROW = 80, CEIL = 74;
let plats = null, coins = [], pups = [], bits = [], popups = [], ball = null, state = "title", stateT = 0, clock = 0;
let dist, score, lives, speedV, zone, combo, nearCeil, shieldT, slowT, magnetT, invT, shake, banner;
let best = store.get("rr.best", 0), bestDepth = store.get("rr.bestDepth", 0), newBest = false, coinStreak = 0, coinT = 0;
const meters = () => Math.floor(dist / 20);

function newGame() {
  plats = []; coins = []; pups = []; bits = []; popups = [];
  dist = 0; score = 0; lives = 3; speedV = 70; zone = 0; combo = 0; nearCeil = false;
  shieldT = 0; slowT = 0; magnetT = 0; invT = 0; shake = 0; banner = { text: ZONES[0].name, t: 0 }; newBest = false;
  for (let y = CEIL + 120; y < FH + 40; y += ROW) addRow(y, y < FH * 0.6);
  const start = plats.filter((p) => p.type !== "s").sort((a, b) => Math.abs(a.y - FH * 0.45) - Math.abs(b.y - FH * 0.45))[0];
  start.type = "n"; start.w = Math.max(start.w, 90);
  ball = { x: start.x + start.w / 2, y: start.y - R, vx: 0, vy: 0, on: start, rot: 0 };
  setState("play"); hideCard(); updateHud();
}
function setState(s) { state = s; stateT = 0; }

function addRow(y, safeOnly = false) {
  const z = ZONES[zone], m = meters();
  const w = rnd(66, 110) - Math.min(24, m * 0.03);
  const x = rnd(8, LW - 8 - w);
  let type = safeOnly ? "n" : pick(z.types);
  const p = makePlat(x, y, w, type);
  plats.push(p);
  // a second platform: sometimes spikes, sometimes another safe one
  const spikeChance = safeOnly || m < 10 ? 0 : Math.min(0.55, 0.16 + m * 0.0008);
  if (Math.random() < 0.75) {
    const w2 = rnd(56, 96), side = x + w / 2 < LW / 2 ? 1 : -1;
    const x2 = side > 0 ? rnd(x + w + 34, LW - 8 - w2) : rnd(8, x - 34 - w2);
    if (x2 > 4 && x2 + w2 < LW - 4 && (side > 0 ? x2 > x + w + 30 : x2 + w2 < x - 30)) {
      plats.push(makePlat(x2, y + rnd(-6, 6), w2, Math.random() < spikeChance ? "s" : (safeOnly ? "n" : pick(z.types))));
    }
  }
  // coins and power-ups ride on safe platforms
  if (type !== "s" && Math.random() < 0.55) {
    const n = 1 + (Math.random() * 3 | 0);
    for (let i = 0; i < n; i++) coins.push({ p, ox: p.w / 2 + (i - (n - 1) / 2) * 16, oy: -20, got: false });
  } else if (!safeOnly && Math.random() < 0.09) {
    const kinds = lives < 3 ? ["shield", "slow", "magnet", "heart"] : ["shield", "slow", "magnet"];
    pups.push({ p, ox: p.w / 2, oy: -22, kind: kinds[Math.random() * kinds.length | 0], got: false });
  }
}
function makePlat(x, y, w, type) {
  return { x, y, w, type, py: y, t: 0, dir: Math.random() < 0.5 ? -1 : 1, base: x, ph: Math.random() * 6, broken: false, vy: 0, passed: false };
}

function hit(reason) {
  if (invT > 0) return;
  if (shieldT > 0) { shieldT = 0; invT = 1; sfx.power(); burst(ball.x, ball.y, "#00f5d4", 18); if (reason === "ceil") { ball.on = null; ball.vy = 200; ball.y = CEIL + R + 8; } return; }
  lives--; sfx.hit(); burst(ball.x, ball.y, "#f15bb5", 30); combo = 0;
  if (lives <= 0) { gameOver(); return; }
  // respawn on a safe platform in the middle of the screen
  let p = plats.filter((q) => !q.broken && q.type !== "s" && q.y > FH * 0.3 && q.y < FH * 0.7).sort((a, b) => Math.abs(a.y - FH * 0.45) - Math.abs(b.y - FH * 0.45))[0];
  if (!p) { p = makePlat(LW / 2 - 50, FH * 0.5, 100, "n"); plats.push(p); }
  p.type = "n";
  ball = { x: p.x + p.w / 2, y: p.y - R, vx: 0, vy: 0, on: p, rot: 0 };
  invT = 1.8; slowT = Math.max(slowT, 1.2);
  if (drag) { drag.b0 = ball.x; drag.x0 = drag.lastX; drag.target = ball.x; }
  updateHud();
}
function gameOver() {
  const m = meters();
  if (score > best) { best = score; newBest = true; store.set("rr.best", best); }
  if (m > bestDepth) { bestDepth = m; store.set("rr.bestDepth", bestDepth); }
  setState("dead"); setTimeout(sfx.over, 300);
  setTimeout(() => {
    setState("over");
    showCard(`<h1>Nice <span>run</span></h1>
      <p class="big">${score}</p>
      <div class="rows"><span>Depth</span><b>${m}m</b><span>Zone</span><b>${ZONES[zoneOf(m)].name}</b><span>Best score</span><b>${best}</b><span>Deepest</span><b>${bestDepth}m</b></div>
      <p>${newBest ? "<b>New best!</b>" : "One more?"}</p>
      <span class="go">${isTouch ? "Tap" : "Space"} to roll again</span>`);
  }, 800);
  updateHud();
}

function burst(x, y, color, n) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, s = rnd(60, 260); bits.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.3, 0.7), color }); } }
function popup(text, x, y, color = "#fee440", big = false) { popups.push({ text, x, y, t: 0, color, big }); }

// ---------- input ----------
const keys = { l: false, r: false };
let drag = null; // { id, x0, b0, target, lastX }
// ---------- update ----------
function update(rawDt) {
  clock += rawDt; stateT += rawDt;
  const slow = slowT > 0 ? 0.55 : 1, dt = rawDt * slow;
  for (const b of bits) { b.life -= rawDt; b.x += b.vx * rawDt; b.y += b.vy * rawDt; b.vy += 500 * rawDt; }
  bits = bits.filter((b) => b.life > 0);
  for (const p of popups) p.t += rawDt;
  popups = popups.filter((p) => p.t < 1);
  if (banner) { banner.t += rawDt; if (banner.t > 2.4) banner = null; }
  shake = Math.max(0, shake - rawDt);
  if (state !== "play") return;

  shieldT = Math.max(0, shieldT - rawDt); slowT = Math.max(0, slowT - rawDt); magnetT = Math.max(0, magnetT - rawDt); invT = Math.max(0, invT - rawDt);
  coinT -= rawDt; if (coinT <= 0) coinStreak = 0;

  // world scrolls up
  const m = meters();
  speedV = Math.min(255, 58 + m * 0.36);
  const up = speedV * dt;
  dist += up;
  const z = zoneOf(m);
  if (z !== zone) { zone = z; banner = { text: ZONES[z].name, t: 0 }; sfx.zone(); score += 100; popup("+100 new zone", LW / 2, FH * 0.35, "", true); }

  for (const p of plats) {
    p.py = p.y; p.y -= up; p.t += dt;
    if (p.type === "m" && !p.broken) { const nx = p.base + Math.sin(p.t * 1.6 + p.ph) * 40; p.mdx = nx - p.x; p.x = clamp(nx, 4, LW - 4 - p.w); }
    if (p.broken) { p.vy += GRAV * dt; p.y += p.vy * dt; }
    if (p.crumbleT != null && !p.broken) { p.crumbleT -= dt; if (p.crumbleT <= 0) { p.broken = true; sfx.crumble(); if (ball.on === p) ball.on = null; } }
  }
  const lowest = plats.reduce((a, p) => Math.max(a, p.broken ? -1e9 : p.y), -1e9);
  if (lowest < FH + 20 - ROW) addRow(Math.max(lowest + ROW, FH + 20 - ROW + ROW));
  plats = plats.filter((p) => p.y > CEIL - 60 && p.y < FH + 200);
  coins = coins.filter((c) => !c.got && plats.includes(c.p));
  pups = pups.filter((c) => !c.got && plats.includes(c.p));

  // ball
  const on = ball.on, icy = on && on.type === "i";
  if (drag) {
    // finger drag: the ball eases toward where your finger points (relative, like a slider)
    const want = clamp((drag.target - ball.x) * 12, -340, 340);
    ball.vx += (want - ball.vx) * Math.min(1, dt * (icy ? 4 : on ? 16 : 10));
  } else {
    // keyboard: smooth acceleration toward a target speed, gentle easing to a stop
    const d = (keys.r ? 1 : 0) - (keys.l ? 1 : 0);
    const resp = icy ? 1.6 : on ? 9 : 5;
    ball.vx += (d * MAXVX - ball.vx) * Math.min(1, dt * resp);
  }
  const prevBottom = ball.y + R;
  ball.x += ball.vx * dt;
  if (ball.x < R) { ball.x = R; ball.vx = Math.abs(ball.vx) * 0.3; }
  if (ball.x > LW - R) { ball.x = LW - R; ball.vx = -Math.abs(ball.vx) * 0.3; }
  ball.rot += ball.vx * dt / R;

  if (on) {
    if (on.broken || ball.x < on.x - R * 0.6 || ball.x > on.x + on.w + R * 0.6) { ball.on = null; }
    else {
      ball.y = on.y - R; ball.vy = 0;
      if (on.type === "v") ball.x += on.dir * 75 * dt;
      if (on.type === "m" && on.mdx) ball.x += on.mdx;
    }
  }
  if (!ball.on) {
    ball.vy = Math.min(MAXFALL, ball.vy + GRAV * dt);
    ball.y += ball.vy * dt;
    // land on a platform we crossed this frame (in the platform's own moving frame)
    if (ball.vy >= 0) {
      for (const p of plats) {
        if (p.broken) continue;
        if (ball.x < p.x - R * 0.6 || ball.x > p.x + p.w + R * 0.6) continue;
        const before = prevBottom - p.py, after = ball.y + R - p.y;
        if (before <= 1 && after >= 0) { landOn(p); break; }
      }
    }
    // freefall: count platforms we drop past without touching
    for (const p of plats) if (!p.passed && !p.broken && p.y < ball.y - R && p.type !== "s") { p.passed = true; if (ball.vy > 0) combo++; }
  }

  // ceiling and floor
  if (ball.y - R < CEIL + 4) { hit("ceil"); if (state !== "play") return; }
  if (ball.y - R < CEIL + 40) nearCeil = true;
  else if (nearCeil && ball.y - R > CEIL + 110) { nearCeil = false; score += 50; popup("close call +50", ball.x, ball.y - 30); sfx.close(); }
  if (ball.y - R > FH + 10) { hit("fall"); if (state !== "play") return; }

  // pickups
  for (const c of coins) {
    const cx = c.p.x + c.ox, cy = c.p.y + c.oy;
    if (magnetT > 0) { const dx = ball.x - cx, dy = ball.y - cy, dd = Math.hypot(dx, dy); if (dd < 110) { c.ox += dx / dd * 420 * dt; c.oy += dy / dd * 420 * dt; } }
    if (Math.hypot(ball.x - (c.p.x + c.ox), ball.y - (c.p.y + c.oy)) < R + 8) {
      c.got = true; coinStreak++; coinT = 0.8; const v = 10 * Math.min(5, 1 + Math.floor(coinStreak / 4)); score += v; sfx.coin(coinStreak);
      burst(c.p.x + c.ox, c.p.y + c.oy, "#fee440", 6);
    }
  }
  for (const u of pups) {
    if (Math.hypot(ball.x - (u.p.x + u.ox), ball.y - (u.p.y + u.oy)) < R + 12) {
      u.got = true; sfx.power(); burst(ball.x, ball.y, "#00f5d4", 16);
      if (u.kind === "shield") { shieldT = 10; popup("shield", ball.x, ball.y - 30, "#00f5d4"); }
      if (u.kind === "slow") { slowT = 5; popup("slow-mo", ball.x, ball.y - 30, "#a3cef1"); }
      if (u.kind === "magnet") { magnetT = 8; popup("magnet", ball.x, ball.y - 30, "#fee440"); }
      if (u.kind === "heart") { lives = Math.min(3, lives + 1); popup("+1 life", ball.x, ball.y - 30, "#f15bb5"); }
    }
  }
  score = Math.max(score, 0);
  updateHud();
}

function landOn(p) {
  ball.on = p; ball.y = p.y - R;
  const impact = ball.vy; ball.vy = 0;
  if (p.type === "s") { ball.on = null; ball.vy = -180; hit("spike"); return; }
  if (combo >= 2) {
    const bonus = combo * combo * 5; score += bonus;
    popup(`freefall ×${combo}  +${bonus}`, ball.x, ball.y - 30, "", combo >= 5);
    sfx.combo(combo);
  } else if (impact > 120) sfx.land(0);
  combo = 0;
  if (p.type === "b") { ball.on = null; ball.vy = -430; sfx.spring(); p.t = 0; p.boing = 0.25; }
  if (p.type === "c" && p.crumbleT == null) p.crumbleT = 0.38;
  for (const q of plats) if (q.y >= p.y - 2) q.passed = true;
}

// ---------- HUD ----------
const ui = { depth: $("#depth"), score: $("#score"), lives: $("#lives"), best: $("#best"), fx: $("#fx"), ov: $("#ov"), card: $("#card") };
let lastFx = "";
function updateHud() {
  ui.depth.innerHTML = (dist ? meters() : 0) + "<small>m</small>";
  ui.score.textContent = (score || 0).toLocaleString() + " pts";
  ui.lives.innerHTML = [0, 1, 2].map((i) => `<span class="${i < (lives || 0) ? "" : "off"}"></span>`).join("");
  ui.best.textContent = "BEST " + best;
  const f = [];
  if (shieldT > 0) f.push(`<span>◆ Shield ${Math.ceil(shieldT)}</span>`);
  if (slowT > 0 && invT <= 0) f.push(`<span>◷ Slow ${Math.ceil(slowT)}</span>`);
  if (magnetT > 0) f.push(`<span>◎ Magnet ${Math.ceil(magnetT)}</span>`);
  const h = f.join(""); if (h !== lastFx) { ui.fx.innerHTML = h; lastFx = h; }
}
function showCard(h) { ui.card.innerHTML = h; ui.ov.classList.add("show"); }
function hideCard() { ui.ov.classList.remove("show"); }
function showTitle() {
  setState("title");
  showCard(`<h1>Roll <span>Rush</span></h1>
    <p>The platforms drift up toward the spikes. Keep rolling down.</p>
    <div class="legend">
      <div class="sw" style="background:#5c6f91"></div><div>Solid ground. Safe to land.</div>
      <div class="sw" style="background:repeating-linear-gradient(90deg,#e07a7a 0 6px,transparent 6px 9px)"></div><div>Spikes. Avoid.</div>
      <div class="sw" style="background:#e8b84a;border-radius:50%;width:10px;height:10px;justify-self:center"></div><div>Coins. Quick streaks are worth more.</div>
      <div class="sw" style="background:linear-gradient(90deg,#ff8a5c,#a58fc7)"></div><div>Drop past platforms without landing for a <b>freefall combo</b>.</div>
    </div>
    <p>${isTouch ? "Drag anywhere to roll. The ball follows your finger." : "← → or A D to roll."}</p>
    <span class="go">${isTouch ? "Tap" : "Space"} to start</span>`);
}

// ---------- render ----------
const fx = (x) => OX + x * S, fy = (y) => y * S;
function hex(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mix(a, b, t) { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(",")})`; }
let pal = { bg0: ZONES[0].bg[0], bg1: ZONES[0].bg[1], plat: ZONES[0].plat, ink: ZONES[0].ink }, palFrom = null, palT = 1, lastZone = 0;
function palette(dt) {
  const z = zone || 0;
  if (z !== lastZone) { palFrom = { ...pal }; palT = 0; lastZone = z; }
  const Z = ZONES[z];
  if (palT < 1 && palFrom) {
    palT = Math.min(1, palT + dt / 1.5); const t = palT * palT * (3 - 2 * palT);
    pal = { bg0: mix(palFrom.bg0.startsWith("#") ? palFrom.bg0 : Z.bg[0], Z.bg[0], t), bg1: mix(palFrom.bg1.startsWith("#") ? palFrom.bg1 : Z.bg[1], Z.bg[1], t), plat: mix(palFrom.plat.startsWith("#") ? palFrom.plat : Z.plat, Z.plat, t), ink: Z.ink };
    if (palT >= 1) pal = { bg0: Z.bg[0], bg1: Z.bg[1], plat: Z.plat, ink: Z.ink };
  }
  document.body.style.color = Z.ink;
  document.body.style.setProperty("--muted", z === 5 ? "rgba(241,238,252,.6)" : "#6b6f86");
}
let lastR = performance.now();
function render() {
  const now = performance.now(), rdt = Math.min(0.05, (now - lastR) / 1000); lastR = now;
  palette(rdt);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // soft full-screen gradient; the playfield is marked by two faint rails
  const g = ctx.createLinearGradient(0, 0, 0, VH); g.addColorStop(0, pal.bg0); g.addColorStop(1, pal.bg1);
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  if (OX > 4) { ctx.fillStyle = "rgba(255,255,255,.18)"; ctx.fillRect(OX, 0, LW * S, VH); ctx.fillStyle = "rgba(43,45,66,.06)"; ctx.fillRect(OX - 1, 0, 1, VH); ctx.fillRect(OX + LW * S, 0, 1, VH); }
  ctx.save(); ctx.beginPath(); ctx.rect(OX, 0, LW * S, VH); ctx.clip();
  // slow, soft bokeh drifting upward
  const off = (dist || clock * 20) * 0.25;
  for (let i = 0; i < 9; i++) {
    const x = (i * 97.3 + 40) % LW, r = 30 + (i % 4) * 22, y = ((i * 211.7 - off) % (FH + 200) + FH + 200) % (FH + 200) - 100;
    ctx.fillStyle = zone === 5 ? "rgba(255,255,255,.035)" : "rgba(255,255,255,.18)"; ctx.beginPath(); ctx.arc(fx(x), fy(y), r * S, 0, 7); ctx.fill();
  }
  if (!plats) { ctx.restore(); return; }

  // best-depth marker
  if (bestDepth > 0 && state !== "title") {
    const y = (bestDepth * 20 - dist) + FH * 0.5;
    if (y > CEIL && y < FH) {
      ctx.strokeStyle = pal.ink; ctx.globalAlpha = 0.25; ctx.setLineDash([5 * S, 7 * S]); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(OX, fy(y)); ctx.lineTo(OX + LW * S, fy(y)); ctx.stroke(); ctx.setLineDash([]);
      ctx.globalAlpha = 0.5; ctx.fillStyle = pal.ink; ctx.font = `700 ${11 * S}px system-ui`; ctx.fillText("best " + bestDepth + "m", fx(8), fy(y) - 5 * S); ctx.globalAlpha = 1;
    }
  }

  // platforms: soft rounded slabs with a gentle drop shadow
  for (const p of plats) {
    const X = fx(p.x), Y = fy(p.y), W = p.w * S, H = 10 * S;
    if (p.type === "s") {
      ctx.fillStyle = "rgba(43,45,66,.08)"; rr(X + 2 * S, Y + 4 * S, W, H - 2 * S, 5 * S); ctx.fill();
      ctx.fillStyle = "#c86b6b"; rr(X, Y + 3 * S, W, H - 3 * S, 4 * S); ctx.fill();
      ctx.fillStyle = "#e07a7a";
      for (let k = 0; k < Math.floor(p.w / 10); k++) { const bx = X + (k * 10 + (p.w % 10) / 2) * S; ctx.beginPath(); ctx.moveTo(bx + 1 * S, Y + 4 * S); ctx.lineTo(bx + 5 * S, Y - 5 * S); ctx.lineTo(bx + 9 * S, Y + 4 * S); ctx.closePath(); ctx.fill(); }
      continue;
    }
    const col = p.type === "n" ? pal.plat : TYPE_COL[p.type];
    ctx.globalAlpha = p.broken ? Math.max(0, 0.6 - p.vy / 900) : 1;
    const jx = p.crumbleT != null && !p.broken ? Math.sin(clock * 60) * 1.2 * S : 0;
    ctx.fillStyle = "rgba(43,45,66,.10)"; rr(X + jx + 2 * S, Y + 4 * S, W, H, 5 * S); ctx.fill();
    ctx.fillStyle = col; rr(X + jx, Y, W, H, 5 * S); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.22)"; rr(X + jx + 3 * S, Y + 2 * S, W - 6 * S, 2.5 * S, 1.2 * S); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,.12)";
    if (p.type === "c") for (let k = 1; k < 4; k++) ctx.fillRect(X + jx + W * k / 4, Y + 1 * S, 1.2 * S, H - 2 * S);
    if (p.type === "b") { const c = p.boing > 0 ? 0.4 : 1; ctx.fillStyle = col; for (let k = 0; k < 2; k++) rr(X + W * (0.3 + k * 0.4) - 4 * S, Y + H - 1, 8 * S, 6 * S * c, 2 * S), ctx.fill(); p.boing = Math.max(0, (p.boing || 0) - 1 / 60); }
    if (p.type === "v") { ctx.fillStyle = "rgba(255,255,255,.5)"; const o = ((clock * 30 * p.dir) % 16 + 16) % 16; for (let k = -1; k < p.w / 16; k++) { const bx = X + (k * 16 + o) * S; if (bx > X + 4 * S && bx < X + W - 8 * S) { ctx.beginPath(); ctx.moveTo(bx, Y + 3 * S); ctx.lineTo(bx + 4 * S * p.dir, Y + H / 2); ctx.lineTo(bx, Y + H - 3 * S); ctx.lineWidth = 1.5 * S; ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.stroke(); } } }
    ctx.globalAlpha = 1;
  }
  // coins & power-ups
  for (const c of coins) {
    const X = fx(c.p.x + c.ox), Y = fy(c.p.y + c.oy + Math.sin(clock * 3 + c.ox) * 1.5), w = 0.35 + 0.65 * Math.abs(Math.cos(clock * 2 + c.ox * 0.1));
    ctx.fillStyle = "#e8b84a"; ctx.beginPath(); ctx.ellipse(X, Y, 5.5 * S * w, 5.5 * S, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.45)"; ctx.beginPath(); ctx.ellipse(X - 1.5 * S * w, Y - 1.5 * S, 1.6 * S * w, 1.6 * S, 0, 0, 7); ctx.fill();
  }
  for (const u of pups) {
    const X = fx(u.p.x + u.ox), Y = fy(u.p.y + u.oy + Math.sin(clock * 2.5) * 2);
    const col = { shield: "#5aa9a0", slow: "#7d9ad6", magnet: "#d9a441", heart: "#e07a7a" }[u.kind];
    ctx.fillStyle = "rgba(255,255,255,.85)"; ctx.beginPath(); ctx.arc(X, Y, 11 * S, 0, 7); ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 2 * S; ctx.stroke();
    ctx.fillStyle = col; ctx.font = `800 ${12 * S}px system-ui`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText({ shield: "◆", slow: "◷", magnet: "◎", heart: "♥" }[u.kind], X, Y + 0.5); ctx.textAlign = "start"; ctx.textBaseline = "alphabetic";
  }

  // ball: warm and soft, with a squash on landing
  if (ball && state !== "dead" && state !== "over" && !(invT > 0 && Math.floor(clock * 8) % 2)) {
    const X = fx(ball.x), Y = fy(ball.y), r = R * S;
    ctx.fillStyle = "rgba(43,45,66,.12)"; ctx.beginPath(); ctx.ellipse(X + 1.5 * S, Y + r * 0.9, r * 0.9, r * 0.3, 0, 0, 7); ctx.fill();
    const grd = ctx.createRadialGradient(X - r * 0.35, Y - r * 0.4, r * 0.15, X, Y, r);
    grd.addColorStop(0, "#ffc2a3"); grd.addColorStop(1, "#ff8a5c");
    ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(X, Y, r, 0, 7); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 1.8 * S; ctx.beginPath(); ctx.arc(X, Y, r * 0.58, ball.rot, ball.rot + 1.4); ctx.stroke();
    if (shieldT > 0) { ctx.strokeStyle = "rgba(90,169,160,.55)"; ctx.lineWidth = 2 * S; ctx.beginPath(); ctx.arc(X, Y, r + 6 * S, 0, 7); ctx.stroke(); }
    if (magnetT > 0) { ctx.strokeStyle = "rgba(217,164,65,.22)"; ctx.lineWidth = 1.2 * S; ctx.beginPath(); ctx.arc(X, Y, 110 * S * (0.6 + 0.4 * ((clock * 0.8) % 1)), 0, 7); ctx.stroke(); }
  }
  for (const b of bits) { ctx.globalAlpha = clamp(b.life * 1.6, 0, 0.8); ctx.fillStyle = b.color === "#f15bb5" ? "#ff8a5c" : b.color === "#fee440" ? "#e8b84a" : "#9fb7d6"; ctx.beginPath(); ctx.arc(fx(b.x), fy(b.y), 2.2 * S, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;

  // ceiling: a soft band with rounded spikes; a gentle warm tint when you get close
  ctx.fillStyle = pal.bg0; ctx.fillRect(OX, 0, LW * S, fy(CEIL - 8));
  ctx.fillStyle = "rgba(43,45,66,.06)"; ctx.fillRect(OX, fy(CEIL - 9), LW * S, 1);
  ctx.fillStyle = "#e07a7a";
  for (let x = 0; x < LW; x += 14) { ctx.beginPath(); ctx.moveTo(fx(x + 1), fy(CEIL - 8)); ctx.quadraticCurveTo(fx(x + 7), fy(CEIL + 8), fx(x + 13), fy(CEIL - 8)); ctx.fill(); }
  if (nearCeil && state === "play") { const tg = ctx.createLinearGradient(0, fy(CEIL), 0, fy(CEIL + 70)); tg.addColorStop(0, "rgba(224,122,122,.18)"); tg.addColorStop(1, "rgba(224,122,122,0)"); ctx.fillStyle = tg; ctx.fillRect(OX, fy(CEIL), LW * S, 70 * S); }

  // popups + zone title
  ctx.textAlign = "center";
  for (const p of popups) {
    const a = p.t < 0.15 ? p.t / 0.15 : 1 - Math.max(0, (p.t - 0.5) / 0.5);
    ctx.globalAlpha = a; ctx.font = `800 ${(p.big ? 16 : 13) * S}px system-ui`;
    const x = fx(clamp(p.x, 80, LW - 80)), y = fy(p.y - p.t * 30);
    const w = ctx.measureText(p.text).width + 16 * S;
    ctx.fillStyle = zone === 5 ? "rgba(255,255,255,.14)" : "rgba(255,255,255,.75)"; rr(x - w / 2, y - 14 * S, w, 20 * S, 10 * S); ctx.fill();
    ctx.fillStyle = pal.ink; ctx.fillText(p.text, x, y + 0.5 * S);
  }
  ctx.globalAlpha = 1;
  if (banner && state === "play") {
    const a = banner.t < 0.4 ? banner.t / 0.4 : banner.t > 1.9 ? Math.max(0, (2.4 - banner.t) / 0.5) : 1;
    ctx.globalAlpha = a * 0.9; ctx.fillStyle = pal.ink;
    ctx.font = `700 ${11 * S}px system-ui`; ctx.fillText(`ZONE ${zone + 1}`, fx(LW / 2), fy(FH * 0.24) - 22 * S);
    ctx.font = `800 ${24 * S}px system-ui`; ctx.fillText(banner.text, fx(LW / 2), fy(FH * 0.24));
    ctx.globalAlpha = 1;
  }
  // first-seconds touch hint
  if (isTouch && state === "play" && dist < 300) {
    ctx.globalAlpha = 0.45 * (1 - dist / 300); ctx.fillStyle = pal.ink; ctx.font = `700 ${13 * S}px system-ui`;
    ctx.fillText("← drag anywhere →", fx(LW / 2), fy(FH - 36)); ctx.globalAlpha = 1;
  }
  ctx.textAlign = "start";
  ctx.restore();
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  update(dt); render(); requestAnimationFrame(frame);
}
dist = 0; score = 0; lives = 3; zone = 0; updateHud(); showTitle(); requestAnimationFrame(frame);

// ---------- controls ----------
function startOrResume() {
  if (state === "title" || (state === "over" && stateT > 0.5)) { sfx.ok(); newGame(); return true; }
  if (state === "paused") { setState("play"); hideCard(); return true; }
  return false;
}
function pause() { if (state === "play") { setState("paused"); keys.l = keys.r = false; drag = null; showCard(`<h1>PAUSED</h1><span class="go">${isTouch ? "Tap" : "Space"} to continue</span>`); } }
const K = { ArrowLeft: "l", KeyA: "l", ArrowRight: "r", KeyD: "r" };
addEventListener("keydown", (e) => {
  if (K[e.code] || e.code === "Space") e.preventDefault();
  if (e.code === "KeyM") return toggleSnd();
  if (e.code === "KeyP" || e.code === "Escape") return state === "paused" ? startOrResume() : pause();
  if (e.code === "Space" || e.code === "Enter") { startOrResume(); return; }
  if (K[e.code]) { if (state === "title" || state === "over") startOrResume(); keys[K[e.code]] = true; }
});
addEventListener("keyup", (e) => { if (K[e.code]) keys[K[e.code]] = false; });
addEventListener("blur", () => { keys.l = keys.r = false; drag = null; });
const SENS = 1.35; // finger travel -> ball travel
addEventListener("pointerdown", (e) => {
  if (e.target.closest(".btns")) return;
  e.preventDefault();
  if (startOrResume()) { if (state === "play") drag = { id: e.pointerId, x0: e.clientX, b0: ball.x, target: ball.x, lastX: e.clientX }; return; }
  if (state === "play" && ball) drag = { id: e.pointerId, x0: e.clientX, b0: ball.x, target: ball.x, lastX: e.clientX };
});
addEventListener("pointermove", (e) => {
  if (!drag || e.pointerId !== drag.id || !ball) return;
  drag.lastX = e.clientX;
  drag.target = clamp(drag.b0 + (e.clientX - drag.x0) / S * SENS, R, LW - R);
  // keep the anchor in range so reversing direction at a wall feels immediate
  if (drag.target <= R || drag.target >= LW - R) { drag.b0 = drag.target; drag.x0 = e.clientX; }
});
const endDrag = (e) => { if (drag && e.pointerId === drag.id) drag = null; };
addEventListener("pointerup", endDrag); addEventListener("pointercancel", endDrag);
document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });

if (location.search.includes("debug")) window.__rr = {
  get: () => ({ state, m: meters(), score, lives, zone, combo, ballY: ball && Math.round(ball.y), on: !!(ball && ball.on), plats: plats && plats.length }),
  keys, god: () => { invT = 1e9; }, warp: (m) => { dist = m * 20; },
  plats: () => plats.map((p) => ({ x: p.x, y: p.y, w: p.w, t: p.type, b: p.broken })), ball: () => ball,
};
})();
</script>
